# The look of DatePicker (Material 3): a surface_container_high dialog with 28 pixel corners and 24 pixels of padding; the heading in on_surface_variant, the date in on_surface,
# the weekday initials and the month in on_surface_variant / on_surface.
styles:
  - widget: DatePicker
    part: panel
    style:
      background: surface_container_high
      corner_radius: 28
      padding: 24
      elevation: 3
  - {widget: DatePicker, part: heading, style: {foreground: on_surface_variant}}
  - {widget: DatePicker, part: chosen, style: {foreground: on_surface}}
  - {widget: DatePicker, part: month, style: {foreground: on_surface}}
  - {widget: DatePicker, part: initial, style: {foreground: on_surface}}
