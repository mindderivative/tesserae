# One day of a date picker (Material 3): a 48 pixel target holding a 40 pixel circle with the number in `body_large`. Today is outlined in `primary`; the selected day is a
# `primary` circle with `on_primary` text; a day outside the month shown is `on_surface_variant`; a disabled day is dimmed. It is pressable; `handlers: {on_click: ...}` on
# the call is what a press does. One view for the four states the old fragments were.
params:
  day: {type: str, default: "", doc: "The number shown."}
  selected: {type: bool, default: false, doc: "The chosen day."}
  today: {type: bool, default: false, doc: "Today."}
  outside: {type: bool, default: false, doc: "A day of the month before or after the one shown."}
  disabled: {type: bool, default: false, doc: "Dimmed, and not pressable."}
widget: Container
interaction: true
disabled: "{{ disabled }}"
a11y:
  role: button
  label: "{{ day }}"
  selected: "{{ selected }}"
  current: "{{ 'date' if today else False }}"
style:
  width: 48
  height: 48
  align_content: center
  corner_radius: full
children:
  - widget: Container
    name: circle
    style: {width: 40, height: 40, corner_radius: full, align_content: center}
    children:
      - {widget: Text, name: number, text: "{{ day }}", typography_role: body_large, text_align: center}
