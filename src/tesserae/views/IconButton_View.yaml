# The Material 3 icon button: standard, filled, tonal or outlined, in five sizes and three widths, round or square, with a toggle form that swaps its icon.
# `label` is required in spirit: it names the button for a screen reader and is its tooltip, since an icon has no text. `handlers: {on_click: save}` on the
# call is what a press does. A toggle flips `selected` (two-way, or held by the button when nothing is bound). Colours, sizes and shapes are in
# IconButton_Stylesheet.yaml.
params:
  icon: {type: str, default: "", doc: "The icon."}
  selected_icon: {type: str, default: "", doc: "For a toggle: the icon while it is on (the same icon when empty)."}
  label: {type: str, default: "", doc: "What it does: its accessible name and its tooltip."}
  variant: {type: enum, choices: [standard, filled, tonal, outlined], default: standard, doc: "standard has no container; filled is the strongest; tonal is softer; outlined has a border."}
  size: {type: enum, choices: [xs, s, m, l, xl], default: s, doc: "32, 40, 56, 96 or 136 pixels tall."}
  width_kind: {type: enum, choices: [narrow, default, wide], default: default, doc: "narrow, as tall as it is, or wide."}
  shape: {type: enum, choices: [round, square], default: round, doc: "A circle, or a rounded square. A toggle swaps to the other shape while selected."}
  disabled: {type: bool, default: false, doc: "Dimmed, not focusable, and it does not respond."}
  toggle: {type: bool, default: false, doc: "A press flips `selected`."}
  selected: {type: bool, default: false, model: true, doc: "For a toggle: whether it is on."}
  tint: {type: str, default: "", doc: "A standard button's icon colour, a colour role such as on_primary_container (on_surface_variant when empty)."}
widget: Container
interaction: true
disabled: "{{ disabled }}"
style:
  flex_direction: horizontal
  align_content: center
handlers:
  on_click: "selected = (not selected) if toggle else selected"
a11y:
  role: button
  label: "{{ label }}"
  pressed: "{{ selected if toggle else None }}"
tooltip: "{{ label }}"
children:
  - widget: Icon
    name: icon
    icon: "{{ selected_icon if (toggle and selected and selected_icon != '') else icon }}"
