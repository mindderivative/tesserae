# The Material 3 carousel: a row of rounded items that scrolls sideways and settles with an item lined up (the scroll view's `snap`). `items` is a list of {value, title}
# and optionally {image, supporting}; `variant` sets how big they are: `uncontained` (every item `item_width` wide), `multi_browse` (a large item, a medium one, then small ones),
# `hero` (large items with a peek of the next) and `center_hero` (the item in the middle large, with a peek of the ones either side). `width` and `height` are the carousel's own.
# Pressing an item sets `chosen` to its `value`; the items are focusable and the arrows move along them. The wheel and a drag scroll it, and so do the arrows once an item
# is focused.
params:
  items: {type: list, default: [], doc: "The items, each {value, title} and optionally {image, supporting}."}
  variant: {type: enum, choices: [uncontained, multi_browse, hero, center_hero], default: uncontained, doc: "How big the items are."}
  chosen: {type: any, default: "", model: true, doc: "The value of the item last pressed."}
  width: {type: float, default: 360, doc: "How wide the carousel is."}
  height: {type: float, default: 200, doc: "How tall the items are."}
  item_width: {type: float, default: 200, doc: "uncontained: how wide each item is."}
widget: ScrollView
orientation: horizontal
snap: "{{ 'center' if variant == 'center_hero' else 'start' }}"
focus_group: horizontal
a11y: {role: group, label: Carousel}
style:
  width: "{{ width }}"
  height: "{{ height }}"
  flex_direction: horizontal
  gap: 8
  padding: "{{ {'left': 56 + 8, 'right': 56 + 8, 'top': 0, 'bottom': 0} if variant == 'center_hero' else 0 }}"
children:
  - widget: Container
    for: i, it in enumerate(items)
    key: it['value']
    name: item
    interaction: true
    handlers: {on_click: "chosen = it['value']"}
    a11y: {role: listitem, label: "{{ it['title'] }}"}
    style:
      snap_align: "{{ 'center' if variant == 'center_hero' else 'start' }}"
      width: "{{ item_width if variant == 'uncontained' else ((width * 0.55 if i == 0 else (width * 0.28 if i == 1 else 56)) if variant == 'multi_browse' else (width - 56 - 8 if variant == 'hero' else width - 2 * 56 - 2 * 8)) }}"
      height: 100%
      corner_radius: 28
      clip_children: true
      background: surface_container_highest
    children:
      - widget: Image
        name: picture
        if: "it.get('image', '') != ''"
        src: "{{ it.get('image', '') }}"
        fit: cover
        style: {position: absolute, x: 0, y: 0, width: 100%, height: 100%}
      - widget: Container
        name: caption
        style: {position: absolute, x: 0, y: "100%", translate_y: -64, width: 100%, height: 64, padding: {left: 16, right: 16, top: 8, bottom: 8}, flex_direction: vertical, background: "scrim@32%"}
        children:
          - {widget: Text, name: title, text: "{{ it['title'] }}", typography_role: title_medium, max_lines: 1, overflow: ellipsis}
          - {widget: Text, name: supporting, if: "it.get('supporting', '') != ''", text: "{{ it.get('supporting', '') }}", typography_role: body_small, max_lines: 1, overflow: ellipsis}
