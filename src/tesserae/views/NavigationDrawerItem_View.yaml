# One destination of a navigation drawer (Material 3): a 56 pixel tall pill with a 24 pixel icon, a `label_large` label and, at the end, a badge (a count or short
# text). The selected one is `secondary_container`. A screen reader hears a link named by the label, current when it is selected.
# `handlers: {on_click: ...}` on the call is what a press does.
params:
  label: {type: str, default: "", doc: "The destination's name."}
  icon: {type: str, default: "", doc: "The icon."}
  badge: {type: any, default: "", doc: "A count or short text at the end; empty for none."}
  selected: {type: bool, default: false, doc: "Whether this is where the user is."}
  disabled: {type: bool, default: false, doc: "Dimmed and not pressable."}
widget: Container
interaction: true
disabled: "{{ disabled }}"
a11y:
  role: link
  label: "{{ label }}"
  current: "{{ 'page' if selected else False }}"
style:
  flex_direction: horizontal
  align_content: left
  height: 56
  width: 100%
children:
  - {widget: Icon, name: icon, if: "icon != ''", icon: "{{ icon }}"}
  - {widget: Text, name: label, text: "{{ label }}", typography_role: label_large, max_lines: 1, overflow: ellipsis}
  - widget: Container
    name: filler
    style: {flex: expand_horizontal}
  - {widget: Text, name: badge, if: "badge != ''", text: "{{ str(badge) }}", typography_role: label_large}
