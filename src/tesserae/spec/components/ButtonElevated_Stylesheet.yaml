# ButtonElevated: the look of each part of the component, by the part's id.
# A value in {{ }} is one of the component's parameters.
styles:
  - id: root
    style:
      width: "{{ width }}"
      height: "{{ height }}"
      align_content: center
      background: surface_container_low
      corner_radius: "{{ corner_radius }}"
      elevation: level_1
      padding:
        left: 12
        right: 12
        top: 0
        bottom: 0
  - id: label
    style:
      foreground: primary
