# `add_split_button(variant="filled_tonal")`'s declarative counterpart
# -- see `SplitButtonFilled_Component.yaml` for the shared real design
# and stated scope boundary. Colors match `resolve_button_colors`'s
# "filled_tonal" exactly.
params: [label, width, height, corner_radius]
id: root
kind: Container
style:
  flex_direction: horizontal
  gap: 2
children:
  - id: leading
    kind: Rect
    style:
      width: "{{ width }}"
      height: "{{ height }}"
      align_items: center
      justify_content: center
      background: secondary_container
      corner_radius: "{{ corner_radius }}"
    children:
      - id: label
        kind: Text
        text: {content: "{{ label }}", typography_role: label_large}
        style: {foreground: on_secondary_container}
  - id: trailing
    kind: Rect
    style:
      width: "{{ height }}"
      height: "{{ height }}"
      align_items: center
      justify_content: center
      background: secondary_container
      corner_radius: "{{ corner_radius }}"
    children:
      - id: chevron
        kind: Icon
        icon: {name: expand_more}
        style: {width: 22, height: 22, foreground: on_secondary_container}
