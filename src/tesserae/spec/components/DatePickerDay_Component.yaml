# One day in a date picker's month grid.
# Structure only: its look is in DatePickerDay_Stylesheet.yaml.
params: [day]
id: root
kind: Container
children:
  - id: label
    kind: Text
    text:
      content: "{{ day }}"
      typography_role: body_large
      wrap: none
      overflow: ellipsis
      text_align: center
