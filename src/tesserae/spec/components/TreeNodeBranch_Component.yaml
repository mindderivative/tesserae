# `add_tree_node(leaf=false)`'s declarative counterpart -- the real,
# collapsed rest state (see `AccordionHeader_Component.yaml` for the
# real reasoning: `expanded=true`'s chevron flip is a runtime `paint.
# transform` animation, not a structural difference, out of scope for
# a fragment's own static initial pose). See `TreeNodeLeaf_Component
# .yaml` for `left_padding`'s own real reasoning (required, not
# `depth`, since `{{ }}` has no multiplication).
params: [title, width, left_padding]
id: root
kind: Container
style:
  width: "{{ width }}"
  height: 56
  align_items: Center
  padding: {left: "{{ left_padding }}", right: 16, top: 0, bottom: 0}
  gap: 12
children:
  - id: title
    kind: Text
    text: {content: "{{ title }}", role: label_large}
    style: {background: on_surface, flex_grow: 1}
  - id: chevron
    kind: Icon
    icon: {name: expand_more}
    style: {width: 24, height: 24, background: on_surface_variant}
