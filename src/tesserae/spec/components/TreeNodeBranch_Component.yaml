# A tree row that can be expanded: a title and a chevron, indented by its depth.
# Structure only: its look is in TreeNodeBranch_Stylesheet.yaml.
params: [title, width, left_padding]
id: root
kind: Container
children:
  - id: title
    kind: Text
    text:
      content: "{{ title }}"
      typography_role: label_large
  - id: chevron
    kind: Icon
    icon: {name: expand_more}
