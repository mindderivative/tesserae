# A filled button: the highest-emphasis button, for a screen's main action.
# Structure only: its look is in ButtonFilled_Stylesheet.yaml.
params: [label, width, height, corner_radius]
id: root
kind: Rect
children:
  - id: label
    kind: Text
    text:
      content: "{{ label }}"
      typography_role: label_large
      wrap: none
      overflow: ellipsis
      text_align: center
