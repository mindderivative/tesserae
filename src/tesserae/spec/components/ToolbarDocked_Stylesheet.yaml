# ToolbarDocked: the look of each part of the component, by the part's id.
# A value in {{ }} is one of the component's parameters.
styles:
  - id: root
    style:
      flex_direction: horizontal
      width: "{{ width }}"
      height: 64
      background: "{{ background }}"
      align_items: center
      justify_content: center
      padding: 16
      gap: 32
