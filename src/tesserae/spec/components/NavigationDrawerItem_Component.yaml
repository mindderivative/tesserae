# One destination in a navigation drawer: an icon and a label, highlighted when selected.
# Structure only: its look is in NavigationDrawerItem_Stylesheet.yaml.
params:
  - label
  - icon
  - width
  - {selected: false}
id: root
kind: Rect
children:
  - id: icon
    kind: Icon
    icon:
      name: "{{ icon }}"
  - id: label
    kind: Text
    text:
      content: "{{ label }}"
      typography_role: label_large
