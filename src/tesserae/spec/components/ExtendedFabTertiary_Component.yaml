# An extended floating action button in the tertiary colour.
# Structure only: its look is in ExtendedFabTertiary_Stylesheet.yaml.
params:
  - label
  - width
  - {icon: null}
id: root
kind: Container
children:
  - id: icon
    when: "{{ icon }}"
    kind: Icon
    icon:
      name: "{{ icon }}"
  - id: label
    kind: Text
    text:
      content: "{{ label }}"
      typography_role: label_large
      wrap: none
