# `add_extended_fab(variant="tertiary", icon=<given>)`'s declarative
# counterpart -- see `ExtendedFabSurface_Component.yaml` for the shared
# real design/scope boundary. Colors match `resolve_fab_colors`'s
# "tertiary" exactly.
params: [label, icon, width]
id: root
kind: Container
style:
  flex_direction: horizontal
  width: "{{ width }}"
  height: 56
  background: tertiary_container
  corner_radius: large
  elevation: level_3
  align_items: center
  padding: {left: 16, right: 20, top: 0, bottom: 0}
  gap: 8
children:
  - id: icon
    kind: Icon
    icon: {name: "{{ icon }}"}
    style: {width: 24, height: 24, foreground: on_tertiary_container}
  - id: label
    kind: Text
    text: {content: "{{ label }}", typography_role: label_large}
    style: {foreground: on_tertiary_container}
