# `add_icon_button(variant="filled_tonal")`'s declarative counterpart --
# see `IconButtonFilled_Component.yaml` for the shared real design.
# Colors match `resolve_button_colors`'s "filled_tonal" exactly:
# container=secondary_container, icon glyph=on_secondary_container.
params: [icon, size, corner_radius]
id: root
kind: Rect
style:
  width: "{{ size }}"
  height: "{{ size }}"
  background: secondary_container
  corner_radius: "{{ corner_radius }}"
children:
  - id: icon
    kind: Icon
    icon: {name: "{{ icon }}"}
    style: {width: 24, height: 24, background: on_secondary_container}
