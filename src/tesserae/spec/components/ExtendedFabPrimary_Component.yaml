# An extended floating action button in the primary colour: an icon and a label.
# Structure only: its look is in ExtendedFabPrimary_Stylesheet.yaml.
params:
  - label
  - width
  - {icon: null}
id: root
kind: Container
children:
  - id: icon
    when: "{{ icon }}"
    kind: Icon
    icon:
      name: "{{ icon }}"
  - id: label
    kind: Text
    text:
      content: "{{ label }}"
      typography_role: label_large
