# MD3's slider (Tesserae's `controls.Slider`, M40): `value` in 0..1,
# `background` the active track's and handle's colour, `width` the
# track's length and `height` the touch target's. Drag or the arrow keys set it.
params: [background, width, height, value]
id: root
kind: Slider
value: "{{ value }}"
style:
  width: "{{ width }}"
  height: "{{ height }}"
  background: "{{ background }}"
