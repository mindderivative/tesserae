# `add_slider`'s declarative counterpart -- `value`/`background` map
# directly onto `WidgetSpec`'s own top-level `value`/`style.background`
# fields, the identical real shape `Checkbox_Component.yaml` uses for
# `checked`. `add_slider` also hardcodes `corner_radius=0.0` with no
# param, confirmed directly.
params: [background, width, height, value]
id: root
kind: Slider
value: "{{ value }}"
style:
  width: "{{ width }}"
  height: "{{ height }}"
  background: "{{ background }}"
