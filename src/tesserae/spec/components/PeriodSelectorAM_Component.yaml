# A time picker's AM / PM selector, with AM selected.
# Structure only: its look is in PeriodSelectorAM_Stylesheet.yaml.
id: root
kind: Container
children:
  - id: am
    kind: Container
    children:
      - id: am_label
        kind: Text
        text: {content: AM, typography_role: label_large}
  - id: pm
    kind: Container
    children:
      - id: pm_label
        kind: Text
        text: {content: PM, typography_role: label_large}
