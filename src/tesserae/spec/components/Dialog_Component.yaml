# A dialog: a headline and text on a raised panel, over a scrim.
# Structure only: its look is in Dialog_Stylesheet.yaml.
params: [headline, text, width, height, scrim_width, scrim_height]
id: root
kind: Container
children:
  - id: panel
    kind: Container
    children:
      - id: headline
        kind: Text
        text:
          content: "{{ headline }}"
          typography_role: headline_small
      - id: body
        kind: Text
        text:
          content: "{{ text }}"
          typography_role: body_medium
