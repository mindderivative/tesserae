# The selected day in a date picker's grid: a filled circle.
# Structure only: its look is in DatePickerDaySelected_Stylesheet.yaml.
params: [day]
id: root
kind: Container
children:
  - id: label
    kind: Text
    text:
      content: "{{ day }}"
      typography_role: body_large
      wrap: none
      overflow: ellipsis
      text_align: center
