# SplitButtonOutlined: the look of each part of the component, by the part's id.
# A value in {{ }} is one of the component's parameters.
styles:
  - id: root
    style:
      flex_direction: horizontal
      gap: 2
  - id: leading
    style:
      width: "{{ width }}"
      height: "{{ height }}"
      align_items: center
      justify_content: center
      background: transparent
      corner_radius: "{{ corner_radius }}"
      border_color: outline
      border_width: 1.0
      padding:
        left: 12
        right: 12
        top: 0
        bottom: 0
  - id: label
    style:
      foreground: primary
      flex_grow: 1
      min_width: 0
  - id: trailing
    style:
      width: "{{ height }}"
      height: "{{ height }}"
      align_items: center
      justify_content: center
      background: transparent
      corner_radius: "{{ corner_radius }}"
      border_color: outline
      border_width: 1.0
  - id: chevron
    style:
      width: 22
      height: 22
      foreground: primary
