# `add_chip(variant="filter", selected=true)`'s declarative counterpart
# -- a real, distinct structural shape from `ChipFilter_Component.yaml`
# (unselected), not just a color swap: `add_chip` itself automatically
# shows a real "check" leading icon when `variant == "filter" &&
# selected` (confirmed directly, `show_checkmark` in `window_factory.
# rs`) -- no `icon` param needed here, the checkmark is fixed. Colors
# match `resolve_chip_colors`'s "filter" (selected) exactly: container=
# secondary_container, label/icon=on_secondary_container, no border.
params: [label, width]
id: root
kind: Rect
style:
  width: "{{ width }}"
  height: 32
  align_items: center
  padding: {left: 16, right: 16, top: 0, bottom: 0}
  gap: 8
  background: secondary_container
  corner_radius: small
children:
  - id: check
    kind: Icon
    icon: {name: check}
    style: {width: 18, height: 18, foreground: on_secondary_container}
  - id: label
    kind: Text
    text: {content: "{{ label }}", typography_role: label_large}
    style: {foreground: on_secondary_container}
