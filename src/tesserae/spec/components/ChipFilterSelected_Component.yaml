# A filter chip, selected: shows a check mark and the selected colour.
# Structure only: its look is in ChipFilterSelected_Stylesheet.yaml.
params: [label, width]
id: root
kind: Rect
children:
  - id: check
    kind: Icon
    icon: {name: check}
  - id: label
    kind: Text
    text:
      content: "{{ label }}"
      typography_role: label_large
      wrap: none
      overflow: ellipsis
      text_align: center
