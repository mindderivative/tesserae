# Text that opens something when it is clicked.
# Structure only: its look is in Link_Stylesheet.yaml.
params:
  - text
  - width
  - height
  - {wrap: none}
  - {overflow: ellipsis}
id: root
kind: Link
text:
  content: "{{ text }}"
  typography_role: body_large
  wrap: "{{ wrap }}"
  overflow: "{{ overflow }}"
