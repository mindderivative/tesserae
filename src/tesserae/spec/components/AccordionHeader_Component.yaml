# A section header that expands and collapses its content: a title and a chevron.
# Structure only: its look is in AccordionHeader_Stylesheet.yaml.
params: [title, width]
id: root
kind: Container
children:
  - id: title
    kind: Text
    text:
      content: "{{ title }}"
      typography_role: label_large
      wrap: none
      overflow: ellipsis
  - id: chevron
    kind: Icon
    icon: {name: expand_more}
