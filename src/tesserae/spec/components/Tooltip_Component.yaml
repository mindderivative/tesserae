# A tooltip: a short label that appears beside what the pointer rests on.
# Structure only: its look is in Tooltip_Stylesheet.yaml.
params: [text, width]
id: root
kind: Container
children:
  - id: text
    kind: Text
    text:
      content: "{{ text }}"
      typography_role: body_small
      wrap: none
      overflow: ellipsis
