# A search bar: a rounded field with a placeholder.
# Structure only: its look is in SearchBar_Stylesheet.yaml.
params: [placeholder, width, corner_radius]
id: root
kind: Container
children:
  - id: field
    kind: TextField
    text:
      content: "{{ placeholder }}"
      font_family: Roboto
      font_weight: 400
      font_size: 16
