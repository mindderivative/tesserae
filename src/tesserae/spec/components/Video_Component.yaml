# A frame of video, fitted to its box. Frames come from a binding.
# Structure only: its look is in Video_Stylesheet.yaml.
params:
  - width
  - height
  - {fit: fill}
  - {frame: null}
id: root
kind: Image
image:
  fit: "{{ fit }}"
bindings:
  if: "{{ frame }}"
  then:
    frame: "{{ frame }}"
a11y: {hidden: true}
