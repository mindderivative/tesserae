# One tab: a label, and an icon if you want one, with an indicator when selected.
# Structure only: its look is in TabsItem_Stylesheet.yaml.
params:
  - label
  - width
  - {icon: null}
  - {selected: false}
id: root
kind: Rect
children:
  - id: tab
    kind: Container
    children:
      - {id: top, kind: Rect}
      - id: content
        kind: Container
        children:
          - id: icon
            when: "{{ icon }}"
            kind: Icon
            icon:
              name: "{{ icon }}"
          - id: label
            kind: Text
            text:
              content: "{{ label }}"
              typography_role: title_small
      - {id: indicator, kind: Rect}
