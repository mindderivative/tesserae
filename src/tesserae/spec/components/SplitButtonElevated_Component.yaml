# An elevated split button: an action, and a menu of related ones.
# Structure only: its look is in SplitButtonElevated_Stylesheet.yaml.
params: [label, width, height, corner_radius]
id: root
kind: Container
children:
  - id: leading
    kind: Rect
    children:
      - id: label
        kind: Text
        text:
          content: "{{ label }}"
          typography_role: label_large
  - id: trailing
    kind: Rect
    children:
      - id: chevron
        kind: Icon
        icon: {name: expand_more}
