# One destination in a navigation rail: an icon in a pill, with a label under it.
# Structure only: its look is in NavigationRailItem_Stylesheet.yaml.
params:
  - label
  - icon
  - {selected: false}
id: root
kind: Container
children:
  - id: pill
    kind: Rect
    children:
      - id: icon
        kind: Icon
        icon:
          name: "{{ icon }}"
  - id: label
    kind: Text
    text:
      content: "{{ label }}"
      typography_role: label_medium
