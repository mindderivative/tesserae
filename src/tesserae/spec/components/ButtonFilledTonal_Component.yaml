# A filled tonal button: a medium-emphasis button in the secondary container colour.
# Structure only: its look is in ButtonFilledTonal_Stylesheet.yaml.
params: [label, width, height, corner_radius]
id: root
kind: Rect
children:
  - id: label
    kind: Text
    text:
      content: "{{ label }}"
      typography_role: label_large
      text_align: center
