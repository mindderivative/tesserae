# `add_button(variant="filled_tonal")`'s declarative counterpart -- see
# `ButtonFilled_Component.yaml` for the full real design/limitations.
# Colors match `resolve_button_colors` exactly: container=
# secondary_container, label=on_secondary_container, no border/elevation.
params: [label, width, height, corner_radius]
id: root
kind: Rect
style:
  width: "{{ width }}"
  height: "{{ height }}"
  background: secondary_container
  corner_radius: "{{ corner_radius }}"
children:
  - id: label
    kind: Text
    text:
      content: "{{ label }}"
      role: label_large
    style:
      background: on_secondary_container
