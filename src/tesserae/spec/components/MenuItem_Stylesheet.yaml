# MenuItem: the look of each part of the component, by the part's id.
# A value in {{ }} is one of the component's parameters.
styles:
  - id: root
    style:
      width: "{{ width }}"
      height: "{{ height }}"
      align_items: center
      padding: "{{ padding }}"
  - id: label
    style:
      foreground: on_surface
      flex_grow: 1
      min_width: 0
