# `add_card(variant="filled")`'s declarative counterpart -- see
# `CardElevated_Component.yaml` for the shared real design. Colors
# match `resolve_card_colors`'s "filled" exactly: container=
# surface_container_highest, no border/elevation.
params: [width, height]
id: root
kind: Rect
style:
  width: "{{ width }}"
  height: "{{ height }}"
  background: surface_container_highest
  corner_radius: medium
