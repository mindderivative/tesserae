# A floating action button in the secondary colour.
# Structure only: its look is in FabSecondary_Stylesheet.yaml.
params:
  - icon
  - size
  - corner_radius
  - {fab_size: default}
id: root
component_of: "fab.{{ fab_size }}"
kind: Rect
children:
  - id: icon
    kind: Icon
    icon:
      name: "{{ icon }}"
