# `add_fab(variant="secondary")`'s declarative counterpart -- see
# `FabSurface_Component.yaml` for the shared real design. Colors match
# `resolve_fab_colors`'s "secondary" exactly: container=
# secondary_container, icon glyph=on_secondary_container.
params: [icon, size, corner_radius]
id: root
kind: Rect
style:
  width: "{{ size }}"
  height: "{{ size }}"
  background: secondary_container
  corner_radius: "{{ corner_radius }}"
  elevation: level_3
children:
  - id: icon
    kind: Icon
    icon: {name: "{{ icon }}"}
    style: {width: 24, height: 24, foreground: on_secondary_container}
