# `add_button(variant="outlined")`'s declarative counterpart -- see
# `ButtonFilled_Component.yaml` for the full real design/limitations.
# Colors match `resolve_button_colors` exactly: container=transparent,
# label=primary, border_color=outline, border_width=1.0.
params: [label, width, height, corner_radius]
id: root
kind: Rect
style:
  width: "{{ width }}"
  height: "{{ height }}"
  align_items: center
  justify_content: center
  background: transparent
  corner_radius: "{{ corner_radius }}"
  border_color: outline
  border_width: 1.0
children:
  - id: label
    kind: Text
    text:
      content: "{{ label }}"
      typography_role: label_large
    style:
      foreground: primary
