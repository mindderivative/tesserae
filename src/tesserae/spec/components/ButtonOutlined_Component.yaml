# An outlined button: a medium-emphasis button with a border and no fill.
# Structure only: its look is in ButtonOutlined_Stylesheet.yaml.
params: [label, width, height, corner_radius]
id: root
kind: Rect
children:
  - id: label
    kind: Text
    text:
      content: "{{ label }}"
      typography_role: label_large
      wrap: none
      overflow: ellipsis
      text_align: center
