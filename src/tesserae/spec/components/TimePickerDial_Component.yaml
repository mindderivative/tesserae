# `add_time_picker_dial`'s declarative counterpart -- `hour`/`minute`
# map directly onto `WidgetSpec`'s own new top-level `hour`/`minute`
# fields (`tre`'s `spec.rs`, M84 -- the one real new field either of
# these 7 needed, every other kind reuses `checked`/`value`). No
# `background` param -- both `face_tint`/`hand_tint` are real-theme-
# resolved at declarative build time, the identical "no color param"
# contract `add_time_picker_dial` itself already has.
params: [size, hour, minute]
id: root
kind: TimePickerDial
hour: "{{ hour }}"
minute: "{{ minute }}"
style:
  width: "{{ size }}"
  height: "{{ size }}"
