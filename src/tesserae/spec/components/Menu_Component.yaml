# A menu: a surface listing choices, each a menu item.
# Structure only: its look is in Menu_Stylesheet.yaml.
params: [items, width]
id: root
kind: Container
children:
  - id: item
    component: MenuItem
    with:
      width: "{{ width }}"
      height: 48
      padding: {left: 12, right: 12, top: 0, bottom: 0}
    repeat: "{{ items }}"
