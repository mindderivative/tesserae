# DatePickerDayToday: the look of each part of the component, by the part's id.
# A value in {{ }} is one of the component's parameters.
styles:
  - id: root
    style:
      width: 48
      height: 48
      background: transparent
      corner_radius: 24
      border_color: primary
      border_width: 1.0
      align_content: center
  - id: label
    style:
      foreground: primary
