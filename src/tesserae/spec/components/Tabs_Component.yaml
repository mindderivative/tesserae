# Tabs: a row of destinations in one view, with the selected one marked.
# Structure only: its look is in Tabs_Stylesheet.yaml.
params: [items, item_width]
id: root
kind: Container
children:
  - id: row
    kind: Container
    children:
      - id: item
        component: TabsItem
        with:
          width: "{{ item_width }}"
        repeat: "{{ items }}"
  - {id: divider, kind: Rect}
