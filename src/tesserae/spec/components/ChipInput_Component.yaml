# `add_chip(variant="input")`'s declarative counterpart -- see
# `ChipAssist_Component.yaml` for the shared real design/scope
# boundary. Colors match `resolve_chip_colors`'s "input" exactly --
# identical resolved colors to unselected "filter"
# (`ChipFilter_Component.yaml`), but a real, distinct MD3 variant name
# in its own right, kept as its own fragment for that reason.
params: [label, width]
id: root
kind: Rect
style:
  width: "{{ width }}"
  height: 32
  background: transparent
  corner_radius: small
  border_color: outline
  border_width: 1.0
children:
  - id: label
    kind: Text
    text: {content: "{{ label }}", typography_role: label_large}
    style: {foreground: on_surface_variant}
