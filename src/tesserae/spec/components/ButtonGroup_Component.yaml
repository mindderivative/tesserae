# A row of buttons, each made from the same button fragment.
# Structure only: its look is in ButtonGroup_Stylesheet.yaml.
params:
  - items
  - width
  - height
  - corner_radius
  - {button: ButtonFilled}
id: root
kind: Container
children:
  - id: b
    component: "{{ button }}"
    with:
      width: "{{ width }}"
      height: "{{ height }}"
      corner_radius: "{{ corner_radius }}"
    repeat: "{{ items }}"
