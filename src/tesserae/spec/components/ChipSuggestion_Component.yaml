# `add_chip(variant="suggestion")`'s declarative counterpart -- see
# `ChipAssist_Component.yaml` for the shared real design/scope
# boundary. Colors match `resolve_chip_colors`'s "suggestion" exactly
# -- identical resolved colors to unselected "filter"/"input", but a
# real, distinct MD3 variant name in its own right.
params: [label, width]
id: root
kind: Rect
style:
  width: "{{ width }}"
  height: 32
  background: transparent
  corner_radius: small
  border_color: outline
  border_width: 1.0
children:
  - id: label
    kind: Text
    text: {content: "{{ label }}", role: label_large}
    style: {background: on_surface_variant}
