# A suggestion chip: a dynamic suggestion, such as a smart reply.
# Structure only: its look is in ChipSuggestion_Stylesheet.yaml.
params: [label, width]
id: root
kind: Rect
children:
  - id: label
    kind: Text
    text:
      content: "{{ label }}"
      typography_role: label_large
      wrap: none
      overflow: ellipsis
      text_align: center
