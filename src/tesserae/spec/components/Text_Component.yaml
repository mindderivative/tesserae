# Text in one of MD3's type styles and a colour.
# Structure only: its look is in Text_Stylesheet.yaml.
params:
  - text
  - {typography_role: body_medium}
  - {color: on_surface}
  - {wrap: word}
  - {overflow: clip}
id: root
kind: Text
text:
  content: "{{ text }}"
  typography_role: "{{ typography_role }}"
  wrap: "{{ wrap }}"
  overflow: "{{ overflow }}"
