# An elevated button: a tinted surface with a shadow, for emphasis on a busy background.
# Structure only: its look is in ButtonElevated_Stylesheet.yaml.
params: [label, width, height, corner_radius]
id: root
kind: Rect
children:
  - id: label
    kind: Text
    text:
      content: "{{ label }}"
      typography_role: label_large
      wrap: none
      overflow: ellipsis
      text_align: center
