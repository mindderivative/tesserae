# AccordionHeader: the look of each part of the component, by the part's id.
# A value in {{ }} is one of the component's parameters.
styles:
  - id: root
    style:
      width: "{{ width }}"
      height: 56
      align_content: left
      padding: 16
      gap: 12
  - id: title
    style:
      foreground: on_surface
      flex: expand_horizontal
      min_width: 0
  - id: chevron
    style:
      width: 24
      height: 24
      foreground: on_surface_variant
