# Tesserae's own declarative counterpart to `tesserae.widgets.button(...)`
# / `tre`'s own `window.add_button(..., variant="filled")` -- a Rect
# container with a centered Text label, faithful to `add_button`'s real
# "filled" variant colors (`resolve_button_colors`, `window_factory.rs`):
# container = primary, label = on_primary.
#
# Real, honest limitation, not silently glossed over: `{{ }}` parameter
# substitution is purely textual (no arithmetic), so a true MD3 pill
# shape (corner_radius = height / 2, `add_button`'s own real unthemed
# fallback) can't be *derived* from `height` here -- `corner_radius` is
# its own required param instead. Only the "filled" variant is modeled;
# a different variant needs its own fragment (no conditional branching
# in this templating layer) -- a real, deferred scope boundary, not a
# silently narrower reimplementation of `add_button`.
params: [label, width, height, corner_radius]
id: root
kind: Rect
style:
  width: "{{ width }}"
  height: "{{ height }}"
  background: primary
  corner_radius: "{{ corner_radius }}"
children:
  - id: label
    kind: Text
    text:
      content: "{{ label }}"
      role: label_large
    style:
      background: on_primary
