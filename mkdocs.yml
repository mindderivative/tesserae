site_name: Tesserae
site_description: >-
  A declarative Python GUI framework, powered by the Tesserae Render
  Engine (tre) -- write desktop apps in YAML views + Python ViewModels,
  without touching Rust.
site_url: https://mindderivative.github.io/tesserae/
repo_url: https://github.com/mindderivative/tesserae
repo_name: mindderivative/tesserae
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Overview: index.md
  - Installation: installation.md
  - Getting Started: getting-started.md
  - Guide:
      - Apps & Screens: guide/apps-and-screens.md
      - Layout: guide/layout.md
      - Components & Embedding: guide/components.md
      - Declarative Component Fragments: guide/component-fragments.md
      - Widget Catalog: guide/widget-catalog.md
      - Hot Reload: guide/hot-reload.md
      - Logging: guide/logging.md
      - Themes & Fonts: guide/themes-and-fonts.md
      - Interaction & Accessibility: guide/interaction.md
      - Controls: guide/controls.md
      - Overlays: guide/overlays.md
      - App Shell & Docking: guide/app-shell.md
      - Custom Title Bars: guide/custom-title-bars.md
      - Editor Support: guide/editor-support.md
      - Repeater (Lists): guide/repeater.md
      - Reactivity: guide/reactivity.md
      - Binding Expressions: guide/bindings.md
      - Naming Convention: guide/naming-convention.md
      - Releasing Your App: guide/releasing.md
  - API Reference:
      - Python API: api/python.md
      - Overview: api/index.md
      - App: api/app.md
      - instantiate: api/instantiate.md
      - Repeater: api/repeater.md
      - spec (load_view/expand_components): api/spec.md
  - Architecture: architecture.md
  - Design:
      - Custom Windowing (0.3.0): design/custom-windowing.md
  - Changelog: changelog.md
  - Design:
      - Tesserae on tre's Building Blocks: design/building-blocks.md
