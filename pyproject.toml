[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tesserae"
version = "0.1.0"
description = "A pyCopper-style declarative Python GUI framework, powered by the Tesserae Render Engine (tre)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Phil Hodgins", email = "philip.a.hodgins@gmail.com" }]
keywords = ["gui", "desktop", "declarative", "mvvm", "material-design"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: X11 Applications",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "tre",
    "pyyaml>=6.0",
    "Pillow>=10.0",
    "watchfiles>=1.0",
    "loguru>=0.7",
    "materialyoucolor>=3.0.4,<4",
]

[project.urls]
Repository = "https://github.com/mindderivative/tesserae"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/tesserae"]

[tool.pytest.ini_options]
testpaths = ["tests"]
