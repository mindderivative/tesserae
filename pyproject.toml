[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tesserae-ui"  # on PyPI; `tesserae` there is an unrelated project. The import name stays `tesserae`.
version = "0.1.0"
description = "A pyCopper-style declarative Python GUI framework, powered by the Tesserae Render Engine (tre)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"  # the user's floor (M76); 3.9 would also need a compiler for materialyoucolor
authors = [{ name = "Phil Hodgins", email = "philip.a.hodgins@gmail.com" }]
keywords = ["gui", "desktop", "declarative", "mvvm", "material-design"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: X11 Applications",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "tesserae-engine>=0.4.2",  # tre, on PyPI (still `import tre`); PyPI's own `tre` is an unrelated regex library
    "pyyaml>=6.0",
    "Pillow>=10.0",
    "watchfiles>=1.0",
    "loguru>=0.7",
    "materialyoucolor>=3.0.4,<4",
]

[project.scripts]
tesserae = "tesserae.cli:main"  # `tesserae new`, `tesserae add screen` (M67)

[project.urls]
Repository = "https://github.com/mindderivative/tesserae"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/tesserae"]

[tool.pytest.ini_options]
testpaths = ["tests"]
