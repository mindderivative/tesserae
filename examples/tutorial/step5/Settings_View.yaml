name: Settings
widget: Container
classes: [page]
children:
  - widget: Text
    name: title
    classes: [heading]
    text: Settings
    typography_role: headline_medium
  - widget: TextField
    name: name
    label: Your name
    text: "{{ name }}"
    style: {width: 240}
  - widget: Container
    name: buttons
    classes: [row]
    children:
      - {widget: Button, name: theme, label: Light or dark, variant: outlined, handlers: {on_click: toggle_dark}}
      - widget: Button
        name: back
        label: Back
        variant: text
        disabled: "{{ not app.can_go_back }}"
        handlers: {on_click: go_back}
