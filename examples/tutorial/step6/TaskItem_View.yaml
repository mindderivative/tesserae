id: root
kind: Container
style: row_Style.yaml
children:
  - id: done
    kind: Checkbox
    style: {width: 40, height: 40, background: surface}
    bindings: {checked: "{{ done.get() }}"}
    two_way: checked
  - id: label
    kind: Text
    classes: [task]
    text: {content: Task, typography_role: body_large}
    bindings: {text: "{{ text.get() }}"}
  - id: remove
    component: IconButtonStandard
    with: {icon: close, size: 40, corner_radius: 20}
    handlers: {on_click: remove_self}
