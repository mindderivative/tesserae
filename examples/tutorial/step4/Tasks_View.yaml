name: Tasks
widget: Container
classes: [page]
children:
  - widget: Text
    name: title
    classes: [heading]
    text: Tasks
    typography_role: headline_medium
  - widget: Container
    name: stats
    classes: [row]
    children:
      - {widget: Stat, name: open, label: Open, value: "{{ open_text }}"}
      - {widget: Stat, name: finished, label: Done, value: "{{ done_text }}"}
  - widget: Button
    name: add
    label: Add a task
    variant: filled
    style: {width: 140}
    handlers: {on_click: add_task}
  - widget: Container
    name: list
    classes: [rows]
    children:
      - for: task in tasks
        key: task.id
        widget: TaskItem
        name: row
        task: "{{ task }}"
        on_toggle: "toggle(task.id)"
        on_remove: "remove(task.id)"
