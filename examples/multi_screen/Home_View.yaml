# The Home screen. `Home_ViewModel.py` navigates; `app.state.came_from` is the app's shared state.
name: Home
widget: Container
style: {flex_direction: vertical, width: 240, height: 150, gap: 8, padding: 16, background: surface}
children:
  - {widget: Text, name: label, text: Home, typography_role: headline_small, style: {foreground: on_surface}}
  - {widget: Text, name: came_from, text: "{{ app.state.came_from }}", typography_role: body_medium, style: {foreground: on_surface_variant}}
  - {widget: Button, name: button, label: Open settings, style: {width: 160}, handlers: {on_click: go_to_settings}}
