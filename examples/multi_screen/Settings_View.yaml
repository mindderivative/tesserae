id: root
kind: Container
style: {flex_direction: vertical, width: 240, height: 120, gap: 12, padding: 16}
children:
  - id: label
    kind: Text
    text: {content: "Settings", font_family: Roboto, font_size: 20}
    style: {width: 200, height: 32, foreground: "#FFFFFF"}
  - id: button
    kind: Rect
    style: {width: 160, height: 40, background: "#03DAC6", corner_radius: 8}
    handlers: {on_click: "go_to_home"}
    a11y: {label: "Back to home"}
