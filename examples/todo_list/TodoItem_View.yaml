id: root
kind: Container
style: {flex_direction: horizontal, width: 260, height: 36, gap: 8}
children:
  - id: check
    kind: Checkbox
    style: {width: 24, height: 24, background: "#6750A4"}
    bindings: {checked: "{{ done.get() }}"}
    two_way: checked
  - id: label
    kind: Text
    text: {content: "Item", font_family: Roboto, font_size: 16}
    style: {width: 160, height: 28, foreground: "#FFFFFF"}
    bindings: {text: "{{ text.get() }}"}
  - id: remove_button
    kind: Rect
    style: {width: 32, height: 28, background: "#B3261E", corner_radius: 4}
    handlers: {on_click: "remove_self"}
