# One row. A view with `params:` is a component: Todo_View.yaml calls it as `widget: TodoItem`. It has no ViewModel of its own: the list's
# ViewModel (Todo_ViewModel.py) holds the items, and the row calls back with the handlers it is given.
params:
  item: {type: dict, required: true}
  on_toggle: {type: handler}
  on_remove: {type: handler}
widget: Container
style: {flex_direction: horizontal, align_content: left, gap: 8, width: 100%}
children:
  - widget: Checkbox
    name: check
    checked: "{{ item.done }}"
    label: "{{ item.text }}"
    style: {flex: expand_horizontal}
    handlers: {on_change: on_toggle}
  - widget: IconButton
    name: remove_button
    icon: close
    label: Remove item
    handlers: {on_click: on_remove}
