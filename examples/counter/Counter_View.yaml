# The counter: a label and a button. `Counter_ViewModel.py` holds what they show and do.
name: Counter
widget: Container
style: {flex_direction: vertical, width: 240, height: 120, gap: 12, padding: 16, background: surface}
children:
  - widget: Text
    name: label
    text: "{{ label }}"
    typography_role: headline_small
    style: {foreground: on_surface}
    a11y: {live: polite}  # a screen reader announces the new count
  - widget: Button
    name: button
    label: Increment
    style: {width: 120}
    handlers: {on_click: increment}
    a11y: {label: "{{ button_label }}"}  # its accessible name follows the count
