name: Main
widget: Container
style: {flex_direction: vertical, width: 100%, height: 100%, gap: 12, padding: 24, background: surface}
children:
  - widget: Text
    name: title
    text: Tasks
    typography_role: headline_medium
    style: {foreground: on_surface}
  - widget: Text
    name: summary
    text: "{{ summary }}"
    typography_role: body_large
    style: {foreground: on_surface_variant}
  - widget: Button
    name: add
    label: Add a task
    variant: filled
    handlers: {on_click: add_task}
