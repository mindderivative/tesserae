# A screen of the window: it has no `name:` and no ViewModel of its own. It reads the names of the one that serves Window_View.yaml.
widget: Container
classes: [page]
children:
  - widget: Text
    name: title
    classes: [heading]
    text: "{{ app.state.user }}'s tasks"
    typography_role: headline_medium
  - widget: Container
    name: stats
    classes: [row]
    children:
      - {widget: Stat, name: open, label: Open, value: "{{ open_text }}"}
      - {widget: Stat, name: finished, label: Done, value: "{{ done_text }}"}
  - {widget: Button, name: add, label: Add a task, variant: filled, style: {width: 140}, handlers: {on_click: add_task}}
  - widget: Container
    name: list
    classes: [rows]
    children:
      - for: task in tasks
        key: task.id
        widget: TaskItem
        name: row
        task: "{{ task }}"
        on_toggle: "toggle(task.id)"
        on_remove: "remove(task.id)"
