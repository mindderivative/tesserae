# The frame around the screens. With no OS title bar, the window's own title bar is the one at the top.
name: Window
widget: Window
title: Tasks
borderless: true  # no OS title bar: the title bar below is the window's
min_width: 480
min_height: 360
style: {width: 640, height: 480, background: surface, flex_direction: vertical}
title_bar: {title: Tasks, style: {background: primary_container}, buttons: [minimize, maximize, close]}
children:
  - widget: Container
    name: body
    style: {flex: fill, flex_direction: horizontal}
    children:
      - widget: NavigationRailScreens
        name: nav
        items:
          - {label: Tasks, icon: home, screen: Main}
          - {label: Settings, icon: settings, screen: Settings}
      - widget: Container
        name: screens
        style: {flex: fill}
        children:
          - {widget: Main, name: main, route: "", style: {flex: fill}}
          - {widget: Settings, name: settings, route: settings, style: {flex: fill}}
  - {widget: StatusBar, name: status, text: Ready, style: {width: 100%}}
