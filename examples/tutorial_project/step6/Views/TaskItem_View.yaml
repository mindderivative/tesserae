params:
  task: {type: dict, required: true}
  on_toggle: {type: handler}
  on_remove: {type: handler}
widget: Container
children:
  - widget: Checkbox
    name: done
    checked: "{{ task.done }}"
    label: "{{ task.text }}"
    style: {flex: expand_horizontal}
    handlers: {on_change: on_toggle}
  - widget: IconButton
    name: remove
    icon: close
    label: Remove
    handlers: {on_click: on_remove}
