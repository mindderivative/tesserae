id: root
kind: Container
style: {flex_direction: vertical, width: 100%, height: 100%, gap: 12, padding: 24, background: surface}
children:
  - id: title
    kind: Text
    text: {content: Tasks, typography_role: headline_medium}
    style: {foreground: on_surface}
  - id: summary
    kind: Text
    text: {content: 0 tasks, typography_role: body_large}
    style: {foreground: on_surface_variant}
    bindings: {text: "{{ summary.get() }}"}
  - id: add
    component: ButtonFilled
    with: {label: Add a task, width: 140, height: 40, corner_radius: 20}
    handlers: {on_click: add_task}
  - id: list
    kind: Container
    style: {flex_direction: vertical, gap: 4, width: 100%}
