# A window's title bar, two ways.
name: Home
widget: Container
style: {width: 100%, height: 100%, flex_direction: vertical, background: surface}
children:
- widget: TitleBar
  name: bar
  title: Notes
  icon: home
  style: {width: 100%}
  children:
  - widget: TextInput
    name: search
    text: '{{ query }}'
    typography_role: body_medium
    style:
      width: 220
      height: 28
      foreground: on_surface
      background: surface_container_high
      corner_radius: 14
      padding: {left: 12, right: 12, top: 0, bottom: 0}
    a11y: {label: Search}
- widget: Container
  name: body
  style: {flex: expand_vertical, flex_direction: vertical, gap: 12, padding: 24}
  children:
  - widget: Text
    name: heading
    text: A title bar the app draws
    typography_role: title_large
    style: {foreground: on_surface}
  - widget: Text
    name: about
    text: Drag a bar to move the window; double-click to maximize.
    typography_role: body_medium
    style: {foreground: on_surface_variant, width: 520}
  - widget: Container
    name: own_bar
    window_region: drag
    style:
      width: 520
      height: 36
      align_content: left
      gap: 8
      background: surface_container
      corner_radius: 8
      padding: {left: 12, right: 4, top: 0, bottom: 0}
    children:
    - widget: Text
      name: own_label
      text: 'A bar of my own: drag me'
      typography_role: label_large
      style: {foreground: on_surface, flex: expand_horizontal}
    - widget: Rect
      name: own_close
      handlers: {on_click: window.close}
      a11y: {label: Close}
      style: {width: 28, height: 28, corner_radius: 14, background: transparent, align_content: center}
      children:
      - widget: Icon
        name: own_close_icon
        icon: close
        style: {width: 16, height: 16, foreground: on_surface}
