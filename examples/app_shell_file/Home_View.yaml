id: root
kind: Container
style: {flex_direction: vertical, width: 420, gap: 12, padding: 24}
children:
  - id: title
    kind: Text
    text: {content: "Welcome", typography_role: headline_small}
    style: {foreground: on_surface}
  - id: summary
    kind: Text
    text: {content: "", typography_role: body_large}
    style: {foreground: on_surface_variant}
    bindings: {text: "{{ summary.get() }}"}
    a11y: {live: polite}
  - id: open_notes
    kind: Rect
    style: {width: 140, height: 40, background: primary, corner_radius: 20, align_content: center}
    handlers: {on_click: "open_notes"}
    a11y: {label: "Open notes"}
    interaction: {color: on_primary}
    children:
      - id: open_notes_label
        kind: Text
        text: {content: "Open notes", typography_role: label_large}
        style: {foreground: on_primary}
