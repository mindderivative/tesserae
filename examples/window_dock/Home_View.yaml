# The Home screen: a static view, a routed call in Window_View.yaml.
widget: Container
style: {flex_direction: vertical, gap: 12, padding: 24}
children:
- widget: Text
  name: title
  text: Welcome
  typography_role: headline_small
  style: {foreground: on_surface}
- widget: Text
  name: body
  text: Drag a tab to another zone, or a handle to resize one.
  typography_role: body_medium
  style: {foreground: on_surface_variant}
