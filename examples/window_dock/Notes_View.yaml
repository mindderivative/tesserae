# The Notes screen: a two-way text field and a live echo of it. It reads the names of Window_ViewModel.py.
widget: Container
style: {flex_direction: vertical, width: 420, gap: 12, padding: 24}
children:
- widget: Text
  name: title
  text: Notes
  typography_role: headline_small
  style: {foreground: on_surface}
- widget: TextInput
  name: note
  text: '{{ note }}'
  typography_role: body_large
  style: {width: 360, height: 48, background: surface_container_highest, corner_radius: 4}
  a11y: {label: Note}
- widget: Text
  name: echo
  text: '{{ echo }}'
  typography_role: body_medium
  style: {foreground: on_surface_variant}
