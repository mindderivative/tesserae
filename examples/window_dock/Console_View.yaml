# The Console panel: a view called in Window_View.yaml's dock. It has no ViewModel of its own: it reads the names of Window_ViewModel.py.
widget: Container
style: {flex_direction: vertical, gap: 8, padding: 16}
children:
- widget: Text
  name: last
  text: '{{ last }}'
  typography_role: body_medium
  style: {foreground: on_surface}
