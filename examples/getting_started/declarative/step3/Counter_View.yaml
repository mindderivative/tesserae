id: root
kind: Container
style: {flex_direction: vertical, width: 360, height: 160, gap: 12, padding: 16, background: "#1C1B1F"}
children:
  - id: label
    kind: Text
    text: {content: "Count: 0", font_family: Roboto, font_size: 20}
    style: {width: 160, height: 28, foreground: "#FFFFFF"}
  - id: button
    kind: Rect
    style: {width: 96, height: 40, background: "#6750A4", corner_radius: 20, align_items: center, justify_content: center}
    children:
      - id: button_label
        kind: Text
        text: {content: Count, font_family: Roboto, font_size: 16}
        style: {width: 44, height: 20, foreground: "#FFFFFF"}
