      from tesserae.widgets import time_input_field

      hour = time_input_field(app.window, 9, unit="hour")

  # -- Content -----------------------------------------------------------------------------------
  - slug: text
    title: Text
    group: Content
    widgets: [Text]
    md3: |
      Text is set in Material Design 3's type scale: 15 styles in five groups (display, headline, title, body and
      label), each large, medium or small, with a font, size, weight, line height and tracking.
    built: |
      `widget: Text`. Name a `typography_role` (or a `font_family`) and Tesserae fills in the rest; a theme's `typography:` can change
      what a role means. A `Text` needs one of them and a `style.foreground`: without either the view does not build, and the error says which.

      `text` can be an expression, and follows the Signals it reads. `font_family`, `font_size` and `font_weight` replace what the role gives. `wrap` is `word` or `none`,
      `runs` gives pieces of one text their own style and links ([Rich Text & Links](../guide/rich-text.md)). `overflow` is `clip` or `ellipsis`, `text_align` is `start`, `center` or `end`, and `max_lines` cuts a longer text to that many lines (with `overflow: ellipsis` the last
      one ends in an ellipsis). `letter_spacing` adds space between letters, in pixels. `selectable: true` lets the text be selected and copied, and `heading: 1` to `6` makes it a heading of that level for a screen reader.

      The colour is `style.foreground` (required). Tracking: the roles are drawn with none, as the engine draws them; Material 3's per-role values are
      `tokens.MD3_TRACKING`, and a theme turns them on with `typography: tokens.MD3_TRACKING_TYPOGRAPHY` (or one role at a time:
      `typography: {body_large: {tracking: 0.5}}`). A node's own `letter_spacing` wins.
    usage_view: |
      name: article
      widget: Container
      style: {flex_direction: vertical, gap: 8, width: 360, height: 200}
      children:
        - {widget: Text, text: Notes, typography_role: headline_medium, heading: 1, style: {foreground: on_surface}}
        - widget: Text
          text: "{{ summary }}"
          typography_role: body_large
          max_lines: 3
          overflow: ellipsis
          selectable: true
          style: {foreground: on_surface_variant}
    python: |
      from tesserae.widgets import text

      heading = text(app.window, "Notes", typography_role="headline_medium")
    see: [themes/index.md]

  - slug: images
    title: Images
    group: Content
    widgets: [Image]
    md3: |
      An image shows a picture, fitted to its box. Material Design 3 describes how to crop and round it in a
      container: a corner from the shape scale, a circle for an avatar.
    built: |
      `widget: Image` is the engine's picture node: Tesserae reads and decodes the file (Pillow), and `fit` says how it fills the box (`cover` by default, or `contain` or `fill`).
      `src` is relative to the view, and can be an expression, so it follows a Signal. `alt` says what the picture shows, for a screen reader; without it the picture is decorative
      and hidden from one, unless it handles clicks. The path must be relative and stay inside the view's directory; an absolute one, or one that leaves it, is refused.

      Its shape is `style.corner_radius`: a number, a shape token, `full` for a circle on a square picture, or a different radius on each
      corner (`{top_left: 24}`). The engine clips the picture to it: `full` on a square picture is a circle (an avatar), and on any other a pill. Put it in a rule
      (`classes: [avatar]`) and every picture with the class takes the shape. Not built: a picture clipped to any other shape (the engine can mask a node with a circle, a rounded rectangle or a path, but no style passes one on).
      A missing or unreadable file stops the view opening, with the widget's name and the file in the message.
    usage_view: |
      name: profile
      widget: Container
      style: {flex_direction: vertical, gap: 16, width: 240, height: 320}
      children:
        - widget: Image
          src: cat.png
          alt: A grey cat asleep on a windowsill
          fit: cover
          style: {width: 240, height: 160, corner_radius: medium}
        - widget: Image
          src: avatar.png
          alt: Your photo
          style: {width: 64, height: 64, corner_radius: full}
    python: |
      from tesserae.widgets import image

      photo = image(app.window, "cat.png", 200, 150, fit="cover")

  - slug: svg
    title: SVG
    group: Content
    widgets: [Svg]
    md3: |
      Material Design 3 uses SVG for its icons and illustrations. An SVG document is vector art: shapes, gradients,
      patterns, clips, masks and text, which scale to any size without blurring.
    built: |
      `widget: Svg`: the engine parses and draws the whole document as one scene, scaled to fit the node's box and
      centred in it. Tesserae reads the file, and decodes the raster pictures in it (`<image href="...">`: PNG, JPEG, GIF
      or WebP, found next to the SVG file, or a `data:` URL) for the engine, which decodes no image format. `style.foreground` is what
      `currentColor` means in the document, so a monochrome icon follows the theme, light and dark. Give a `width` or a
      `height`, or both.

      Give one of `src`, a `.svg` or `.svgz` file next to the view (an expression, so it follows a Signal), and `content`, the document itself as text. `alt` says what the picture
      shows, for a screen reader; without it the picture is decorative and hidden from one, unless it handles clicks. A missing file, or a document that is not SVG, stops the view
      opening with the widget's name in the message.
    usage_view: |
      name: brand
      widget: Container
      style: {flex_direction: vertical, gap: 16, width: 240, height: 160}
      children:
        - widget: Svg
          src: logo.svg
          alt: The Tesserae logo
          style: {width: 96, height: 96, foreground: primary}
        - widget: Svg
          content: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"><circle cx="12" cy="12" r="10" fill="currentColor"/></svg>'
          style: {width: 24, height: 24, foreground: on_surface}
    python: |
      from tesserae.widgets import svg

      logo = svg(app.window, '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"><circle cx="12" cy="12" r="10" fill="currentColor"/></svg>',
                 width=48, height=48, color="primary", label="A dot")

  - slug: video
    title: Video
    group: Content
    views: [VideoPlayer]
    md3: |
      Video is content, not a component, in Material Design 3; Tesserae shows frames you supply.
    built: |
      An `Image` takes a `frame`, `(rgba bytes, width, height)`, from a binding and shows each new one; it keeps the last when the binding gives nothing. There is no decoder: the app decodes and pushes.

      `widget: VideoPlayer` is a view Tesserae ships (`VideoPlayer_View.yaml`) that puts transport controls under such a picture: a play/pause button, the time, a seek slider, the length and a mute button.

      The app pushes each `frame` as the video plays; `width` and `height` are the picture's size (the controls are as wide) and `fit` how it fills its box (`contain` here). The three
      two-way values are `playing` (the play button flips it; the app's player follows), `position` (seconds; the seek slider shows and writes it, and the app moves it on as it plays)
      and `muted` (the volume button flips it). `duration` is the length in seconds, and the slider is off without one. `buffering` lays a wait ring over the picture, `caption` puts a
      subtitle on a darkened band at its foot, `step` is how far the arrow keys move the slider, and `label` is the player's name for a screen reader.

      On the seek slider: Space plays or pauses, the arrows step the position, M mutes. Not built: a decoder (decode with the library you choose, and set `frame`), full-screen, speeds, a volume level, a poster.
    usage_view: |
      name: movie
      widget: Container
      style: {width: 520, height: 320, padding: 16}
      children:
        - widget: VideoPlayer
          frame: "{{ frame }}"
          playing: "{{ playing }}"
          position: "{{ position }}"
          duration: 125
          muted: "{{ muted }}"
          caption: "{{ words }}"
    python: |
      from tesserae.widgets import video

      clip = video(app.window, 320, 180, fit="contain")

  - slug: carousel
    title: Carousel
    group: Content
    views: [Carousel]
    md3: |
      A carousel shows a row of items that scroll, with the focused one largest. MD3 has multi-browse, uncontained,
      hero and full-screen layouts.
    built: |
      `widget: Carousel` is a view Tesserae ships (`Carousel_View.yaml`): a `ScrollView` that scrolls sideways (`orientation: horizontal`) and settles on an item
      (`snap`, with each item's `snap_align`), of items with 28 pixel corners, 8 pixels apart, with a title on a darkened band.

      Each of `items` is `{value, title}` and optionally `{image, supporting}`. `variant` sets how big the items are: `uncontained` (the default; every item `item_width` wide),
      `multi_browse` (a large item, a medium one, then small ones), `hero` (large items with a peek of the next) or `center_hero` (the middle item large, with a peek of each
      neighbour). `width` and `height` are the carousel's own size (360 by 200 by default). Pressing an item sets `chosen` (two-way) to its `value`.

      The wheel and a drag scroll it; when it stops it settles with an item at the start (the middle for `center_hero`). The items are focusable and the arrow keys move along
      them. A `ScrollView` takes `snap` (`none`, `start`, `center`, `end`) and any node a `snap_align` style, so other strips can do the same. Not built: the sizes changing as
      it scrolls (a multi-browse carousel's large item is the first one), parallax on the pictures, dot indicators, full-screen, autoplay.
    usage_view: |
      name: gallery
      widget: Container
      style: {width: 420, height: 260}
      children:
        - widget: Carousel
          variant: hero
          chosen: "{{ opened }}"
          items:
            - {value: a, title: Paris, supporting: Three days}
            - {value: b, title: Rome}
            - {value: c, title: Lisbon}
    python: |
      from tesserae.widgets import carousel

      gallery = carousel(app.window, 480, 180, layout="multi_browse", items=[])

  - slug: pagination
    title: Pagination
    group: Content
    views: [Pagination]
    md3: |
      Pagination shows where the user is among pages: a row of dots or numbers.
    built: |
      `widget: Pagination` is a view Tesserae ships (`Pagination_View.yaml`): previous and next arrows with the page numbers between them.

      `page` (from 1) is two-way: choosing another writes it back. `pages` is how many there are. `compact` shows "3 of 12" between the arrows instead of the numbers, and `dots`
      shows a dot for each page, the current one `primary`, for a carousel (best under ten pages).

      The first and last pages and the ones beside the current page always show, with an ellipsis for the stretch left out (up to seven pages show whole). The
      current page is a filled button, and each number is named "Page n" and marks the current one as the page. Previous is disabled on the first page and next on the
      last. Tab visits each control, and Enter or Space chooses. Not built: an items-per-page control, a count of all the items, and a jump-to field.
    usage_view: |
      name: results
      widget: Container
      style: {flex_direction: vertical, gap: 12, width: 480, height: 200}
      children:
        - {widget: Pagination, page: "{{ page }}", pages: "{{ total_pages }}"}
        - {widget: Pagination, page: "{{ page }}", pages: "{{ total_pages }}", compact: true}
        - {widget: Pagination, page: "{{ page }}", pages: 5, dots: true}
    python: |
      from tesserae.widgets import pagination

      pages = pagination(app.window, 10, current=0)

  # -- Beyond MD3 --------------------------------------------------------------------------------
  - slug: status-bar
    title: Status bar
    group: Beyond MD3
    views: [StatusBar]
    md3: |
      Material Design 3 has no status bar. A desktop app often wants one, so this is a thin strip in MD3's
      surface and *label* style.
    built: |
      `widget: StatusBar` is a view Tesserae ships (`StatusBar_View.yaml`): a 24 pixel `surface_container` strip as wide as the place it is put in, with
      `label_small` text in `on_surface_variant`.

      Each of `items` is `{text}` and optionally `{icon, side, value, tooltip}`; `side` is `start` (the default), `center` or `end`. `text` (a string) is a shorthand for one message
      at the start, and `width` sets the bar's width instead of the place it is put in. `progress` (0 to 1) shows a 4 pixel determinate indicator along the top edge, and `busy`
      one with no end. `clicked` is two-way: the `value` of the item last pressed.

      An item with a `value` is a button: it has a state layer, a tooltip if it has one, and pressing it sets `clicked`. The centre section is centred on the
      bar whatever the sides hold. The bar is announced politely when its items change. Not built: items that can be dragged or hidden when the window is
      narrow.
    usage_view: |
      name: editor
      widget: Container
      style: {flex_direction: vertical, width: 640, height: 200}
      children:
        - widget: StatusBar
          clicked: "{{ item }}"
          busy: "{{ saving }}"
          items:
            - {text: Ready}
            - {text: Saved, side: center}
            - {text: "Ln 4, Col 2", side: end, value: goto, tooltip: Go to line}
            - {text: UTF-8, side: end, icon: home, value: encoding}
    python: |
      from tesserae.widgets import status_bar

      status = status_bar(app.window, "Ready", style={"height": 32})
    see: [guide/windows-and-docks.md]

  - slug: node-graph
    title: Node graph
    group: Beyond MD3
    widgets: [NodeGraph, GraphNode]
    md3: |
      Material Design 3 has no node graph. This is a pannable canvas of titled boxes joined by edges, for tools.
    built: |
      The `NodeGraph` kind (`widget: NodeGraph` in a view), with `GraphNode` children at an `x` and a `y`. Drag the background to pan, the wheel zooms about the pointer, drag a node (or
      press the arrow keys on a focused one) to move it, and its edges follow.

      `edges` are the links, each `{from: id, to: id}`, the ids of the `GraphNode`s: their path from the view's root, as `root.graph.load` for the node `load` in the graph `graph`; an edge runs from the right side of one node to the left of the other, as a curve. `snap`
      makes a node the user moves land on a multiple of that many pixels (an arrow key steps one square, or 8 pixels with no grid; `0` is no grid), `arrows` ends each edge in an arrowhead, and `fit`
      pans and zooms when it opens so every node shows (never past actual size). A `GraphNode` has a `label` (its title), an `x` and a `y` in the graph's own coordinates, and its
      size from `style`; what it holds goes in its body.

      Pressing a node chooses it (a `primary` border, and it is selected to a screen reader); pressing the background chooses none. From Python the widget has `fit_to_view(padding)`,
      `zoom`, `offset`, `snap`, `arrows` and `selected` (a `Signal` of the node chosen). Not built: ports and dragging to connect, labels on edges, selecting several, a minimap, undo, and
      building only the nodes in view.
    usage_view: |
      name: pipeline
      widget: Container
      style: {width: 640, height: 360}
      children:
        - widget: NodeGraph
          name: graph
          arrows: true
          fit: true
          snap: 20
          edges: [{from: root.graph.load, to: root.graph.clean}, {from: root.graph.clean, to: root.graph.save}]
          style: {width: 640, height: 360}
          children:
            - {widget: GraphNode, name: load, label: Load, x: 20, y: 40, style: {width: 140, height: 80}}
            - {widget: GraphNode, name: clean, label: Clean, x: 240, y: 100, style: {width: 140, height: 80}}
            - {widget: GraphNode, name: save, label: Save, x: 460, y: 40, style: {width: 140, height: 80}}
    python: |
      from tesserae.widgets import graph_node, node_graph

      graph = node_graph(app.window, 480, 320)
      source = graph_node(app.window, graph, "Source", 40, 40, 120, 60)

  - slug: splitter
    title: Splitter
    group: Beyond MD3
    widgets: [Splitter]
    md3: |
      Material Design 3 has no splitter. It divides the window into two panes with a bar the user drags.
    built: |
      `widget: Splitter` has exactly two children, the panes, and a handle between them: a 16 pixel bar holding MD3's 4 by 48 drag handle, with a
      resize cursor, a Tab stop, and the role of a slider for a screen reader.

      `orientation` puts the panes side by side (`horizontal`, the default) or one above the other (`vertical`). `position`, from 0 to 1, is how much of the room the first
      pane has, two-way: bind a Signal and the handle writes it. `min_first` and `min_second` are the least each pane can be, in pixels. With `collapsible: true` a double click
      on the handle closes the first pane, and opens it again where it was. `label` is what a screen reader calls the handle.

      The pointer drags it (the pointer is captured, so it keeps following outside the handle); the arrow keys along its axis move it by 5%, Home
      and End go to the ends; a screen reader can increment, decrement and set it. For more than two panes, nest splitters.
    usage_view: |
      name: editor
      widget: Container
      style: {width: 640, height: 400}
      children:
        - widget: Splitter
          position: "{{ sidebar }}"
          min_first: 120
          min_second: 240
          collapsible: true
          label: Resize the sidebar
          style: {width: 640, height: 400}
          children:
            - {widget: Container, name: sidebar_pane, style: {background: surface_container, flex: fill}}
            - {widget: Container, name: content_pane, style: {background: surface, flex: fill}}
    python: |
      from tesserae.widgets import splitter

      panes = splitter(app.window, left.node, right.node, 640, 400, orientation="horizontal", position=0.3)

  # -- Windows and docking -----------------------------------------------------------------------
  - slug: window
    title: Window
    group: Windows and docking
    widgets: [Window]
    md3: |
      Material Design 3 describes how an app's content adapts to a window, not the window itself. `widget: Window` is the OS
      window as a view: the root of `Window_View.yaml`, with its title, size and title bar.
    built: |
      Before the view is built, the `Window` becomes a vertical container holding the `TitleBar` and a content container;
      `App` reads its title, size, `borderless` and minimum size when it loads the view. A `Window` is the root of its view: it can't be nested or embedded. There is
      one `Window` per window view. The app's own window is the window view it opens with `app.open_view("Window")` (an app has one), and a second OS window is another view whose
      root is a `Window`, opened with `app.open_window`.

      | Property | Meaning |
      | --- | --- |
      | `title`, `borderless`, `min_width`, `min_height` | the OS window's title, whether it has no OS title bar or borders, and the least the user can resize it to |
      | `title_bar` | a `{title, icon, buttons}` mapping for the window's title bar; in a window that is not `borderless` it is a plain header, with no buttons of its own (the OS draws them) |
      | `style` | `width` and `height` are the window's size (a second window whose view has no `Window` root is 480 by 320), and `background` its fill; the rest lays out the content |
      | `remember` | true, or a name: the size, the place (where the platform lets an app say: not Wayland) and the maximized state are kept in a small file in the user's config directory (named for the title, or the name) and put back next run; a maximized window keeps the size it had before. The app's own window only |
      | `fullscreen`, `maximized` | set when the view loads, only when written (in a second window too) |
      | `transparent`, `blur_behind`, `click_through` | set before the window opens, only when written; the platform may refuse one, and says so |

      A view branches on the window's size with `app.width_class` and `app.height_class` (Material 3's size classes).

      **Several windows.** `app.open_window("Prefs")` builds `Prefs_View.yaml` in a new OS window and returns its `AppWindow`; `app.windows` holds the others by name,
      `app.window_of("prefs")` finds one and `app.close_window("prefs")` closes it. The view's `Window` root gives that window its title, size, minimum size, `borderless` and flags.
      `modal=True` puts a dimming layer over the parent (the app's window, or `parent=` another `AppWindow`) that takes its input until the child closes. From a view,
      the handler `open_window('Prefs')` does the same, and `open_window('Prefs', True)` opens a modal one. A second window has no screens or routes, and closing it leaves the
      app running; closing the app's own window closes them all. Not built: a native menu bar.

      ```yaml
      name: window
      widget: Window
      title: Notes
      borderless: true
      style: {width: 960, height: 600, flex_direction: vertical}
      title_bar: {title: Notes, buttons: [minimize, maximize, close]}
      children:
        - {widget: Main, name: main, route: "", style: {flex: fill}}
      ```

      ```python
      app = App(title="Notes", root=HERE)
      app.open_view("Window")     # Views/Window_View.yaml: the app's window
      ```

      ```python
      prefs = app.open_window("Prefs", modal=True)   # Prefs_View.yaml, in a window of its own
      prefs.on_close(save)
      prefs.center()                                 # where the system lets an app place a window
      ```
    see: [guide/windows-and-docks.md, guide/custom-title-bars.md]

  - slug: title-bar
    title: Title bar
    group: Windows and docking
    widgets: [TitleBar]
    md3: |
      Material Design 3's top app bar sits inside the window; a title bar is the window's own strip. A desktop app that
      draws its own keeps the OS's behaviour: drag to move, double-click to maximize.
    built: |
      `widget: TitleBar` in a view, or `title_bar:` on a `Window`. It has a `title`, an `icon` and `buttons` (any of `minimize`, `maximize` and `close`, all three by default). It
      is 40 pixels high unless its `style` gives another height, and each button is 46 pixels wide. A press on the bar (or its title or icon) moves the window and a double click
      maximizes it. Its buttons are the handlers `window.minimize`, `window.toggle_maximized`, `window.close` and the like, which need no ViewModel; in a dialog or a sheet
      `buttons: [dismiss]` closes it. The maximize button shows the restore glyph while the window is maximized, and each button says what it does when the pointer rests on it
      (Minimize, Maximize, Close). While the window is not the focused one, the title, icon and buttons fade. The bar's children sit between the title and the buttons, so tabs, a
      search field or icon buttons can live there; the window's `flex_direction: vertical` puts the bar above the content. On macOS the bar leaves room at its start for the
      traffic lights and hides its own buttons. A right click on the bar opens the OS's window menu only if the app was made with `system_menu=True`. Not built: the Windows 11 snap
      layouts on the maximize button, and a different glyph set for the buttons.
    usage_view: |
      name: notes_bar
      widget: Container
      style: {flex_direction: vertical, width: 640, height: 200}
      children:
        - widget: TitleBar
          name: bar
          title: Notes
          icon: home
          buttons: [minimize, maximize, close]
          children:
            - {widget: IconButton, name: find, icon: search, label: Find, handlers: {on_click: find}}
    see: [guide/custom-title-bars.md, guide/windows-and-docks.md]

  - slug: dock
    title: Dock
    group: Windows and docking
    widgets: [Dock]
    md3: |
      Material Design 3 has no dock. A desktop tool often wants panels around its content that the user can move and
      resize: files on the left, output below.
    built: |
      `widget: Dock` holds `DockPanel`s; each says its zone with the style field `zone`: `left`, `right`, `top`, `bottom` or `center`. A left or right zone's size is its panel's
      `width`, and a top or bottom one's its `height` (240 and 180 pixels when the panel gives none). Each zone is a column: a strip of tabs, one for each panel, over the panel
      that is showing. The tab is the panel's `title` (else its name). A click or Enter on a tab shows its panel, and the left and right arrow keys move along the strip. The user
      drags a tab to another zone, or to a half of a split (see the dock panel), and drags the handles between zones to resize them. Dragging is pointer only, so a tab's context menu
      (a right click, the Menu key or Shift+F10) offers "Move to ..." for each zone and each half. A window has one `Dock`, and `zone:` is an error on anything but a `DockPanel` in a `Dock`.

      `view.dock_host(id)` reads and sets the layout from Python. A node's id is its path from the view's root, so the dock named `dock` is `view.dock_host("root.dock")`, and
      its panel `files` is `"root.dock.files"`:

      | Call | What it does |
      | --- | --- |
      | `set_size(zone, px)`, `size(zone)` | a zone's size, kept between 120 pixels and 70% of the room |
      | `layout()` | where every panel is, which tab shows in each zone, the zone sizes, the sizes of the splits, and the halves (see the dock panel), as plain data |
      | `restore(saved)` | puts a `layout()` back; titles, zones and halves the dock does not have are skipped |
      | `move(panel, where)` | a panel (its id) to the tabs of a zone (`"left"`) or a half (its id), from code |
      | `closed()`, `close(panel)`, `reopen(panel)`, `on_closed(fn)` | the closable panels that are shut |

      Editing the YAML while the app runs keeps the layout the user made: which zone each panel is in, which tab shows, and the sizes.

      A panel with `closable: true` has a close button on its tab. A Dock's `closed` (a list, two-way) holds the names of the closable panels that are shut: a close
      button adds its panel's name, and taking a name out opens the panel again, as the last tab of its zone. Putting names in shuts them without the button. Not built: floating
      panels, tearing a panel off into a window, maximising a panel, reordering tabs, and layouts saved by name.
    usage_view: |
      name: studio
      widget: Window
      title: Studio
      style: {width: 900, height: 600, flex_direction: vertical}
      children:
        - widget: Dock
          closed: "{{ shut }}"
          children:
            - {widget: DockPanel, name: files, title: Files, closable: true, style: {zone: left, width: 220}}
            - {widget: DockPanel, name: editor, title: Editor, style: {zone: center}}
    see: [guide/windows-and-docks.md, guide/docking.md]

  - slug: dock-panel
    title: Dock panel
    group: Windows and docking
    widgets: [DockPanel]
    md3: |
      Material Design 3 has no dock panel. It is one panel of a dock: a titled tab in a zone.
    built: |
      `widget: DockPanel`, with `zone` in its `style` and a `title` for its tab (else its name). `closable: true` puts a close button on its tab (see the Dock's `closed`).

      A `DockPanel` inside another is a split of it, side by side (`flex_direction: horizontal`, the default) or top and bottom (`vertical`), with a handle between the halves
      to resize them. A half with a `width` (or `height`) of its own keeps it, and the others share what is left. A panel has either splits or content, not both, and a half has no
      `zone`. Each half is a small zone of its own: a tab strip over it, with a tab for the half's own content (titled by its `title:`, else its name) and one for each panel dropped
      on it.

      Drag a tab over a half and the highlight shows what a drop will do. The outer quarter of each side of a half is an **edge**: dropping there splits the half, the panel
      taking a new half on that side with a handle between the two. The rest, the tab strip included, is the **middle**: dropping there adds the panel to the half as another tab,
      and the half shows it. A tab in a half is dragged like any other, to a zone, to another half or to the edge of one. A half that a drop made collapses when its last panel
      leaves, and its neighbour takes the room back. You cannot drop a panel on the halves inside it. In the tab menu (right click, the Menu key or Shift+F10) "Move to ..."
      lists the halves too.

      From Python, with `dock = view.dock_host("root.dock")`. The half and the panel are named by their ids, their paths from the view's root (`root.dock.editor.source`):

      | Call | What it does |
      | --- | --- |
      | `dock.halves()` | each half's panels (their ids) and the one it shows (`None`: the half's own content) |
      | `dock.show_in_half(half, panel)` | shows a panel in a half; `panel` of `None` shows the half's own content |
      | `dock.half_of(panel)` | the id of the half a panel is in, or `None` if it is in a zone |
      | `dock.move(panel, where)` | a panel into a half or a zone (`"left"`) |

      `dock.layout()` records the halves, so the arrangement the user made survives a restart: `halves` has, for each half, the titles of the panels in it and the tab it shows,
      and `made` has, for each half of the YAML that the user split, the tree of the splits (an `axis` of `x` or `y`, the first part's `size` in pixels, and its `first` and
      `second` parts), as plain data you can write to a file. `dock.restore(saved)` takes the user's splits apart, makes the ones in the layout and puts the panels in their
      halves; halves and titles the dock does not have are skipped, and a split none of whose panels come back is not made. A half is found by its id, so renaming one in the
      file means a saved layout no longer finds it. Editing the YAML while the app runs keeps the strips, the panels dropped on a half and the splits the user made; a half the
      file removes sends the panels dropped in it back to their zones. Not built: dragging or closing a half's own content (what the YAML put in it), and reordering tabs.
    usage_view: |
      name: studio
      widget: Window
      title: Studio
      style: {width: 900, height: 600, flex_direction: vertical}
      children:
        - widget: Dock
          children:
            - {widget: DockPanel, name: outline, title: Outline, style: {zone: left, width: 220}}
            - widget: DockPanel
              name: editor
              title: Editor
              style: {zone: center}
              children:
                - {widget: DockPanel, name: source, title: Source, style: {width: 400}}
                - {widget: DockPanel, name: preview, title: Preview}
    see: [guide/windows-and-docks.md]

  - slug: routed-views
    title: Routed views
    group: Windows and docking
    md3: |
      Material Design 3's navigation rail and bar move between an app's destinations. A routed view is a destination whose
      content is a view of its own.
    built: |
      A call of a view with a `route:` in the window view. It is registered as a screen of the app under the view's name, and
      shown while it is current; the others are hidden, with their state. `NavigationRailScreens` is a rail whose
      destinations navigate.

      ```yaml
      name: window
      widget: Window
      title: Notes
      style: {width: 960, height: 600, flex_direction: horizontal}
      children:
        - widget: NavigationRailScreens
          name: nav
          items:
            - {label: Notes, icon: home, screen: Main}
            - {label: Settings, icon: settings, screen: Settings}
        - {widget: Main, name: main, route: "", style: {flex: fill}}
        - {widget: Settings, name: settings, route: settings, style: {flex: fill}}
      ```

      ```python
      app.navigate("Settings")        # a screen, by name
      app.navigate_to("settings")     # a route (a handler's navigate_to(screen) in YAML takes a screen name)
      ```

      A call with a `route:` is the screen, named for the view it calls (`- {widget: Settings, name: settings, route: settings}`
      is the screen `Settings`). A route can read params from the path (`notes/{id:int}`), and the screen showing reads the ones it was reached with as
      `app.params` (`{{ app.params.get('id') }}`); going back or forward restores each step's params, and `show()` clears them. Handlers: `navigate.Settings`,
      `navigate.back`, `navigate.forward`, `navigate_to('Note', {'id': 3})` (a screen by name, with params) and `navigate_route('notes/' + str(id))` (a route by its
      path). The app's `transition` plays between routed screens. Not built: a push/pop stack apart from the history.

      A route can be written as a mapping, `route: {path: admin, guard: signed_in, redirect: "", lazy: true}`:

      | Key | Meaning |
      | --- | --- |
      | `path` | the route (`""` for the home screen) |
      | `guard` | an expression read when the app goes to the screen (`navigate`, `navigate_to`, `back`, `forward`); falsy keeps the app where it is. `show()` is a jump and skips it |
      | `redirect` | a route to go to when the guard says no |
      | `lazy` | the view is built when the screen is first reached (its route exists from the start), then kept; it cannot have an `if:` |

      A routed call inside a routed view is a nested screen: its path is under its parent's (`settings` holding `profile` is `settings/profile`; a path that starts with `/` is from the root),
      the parent shows while a child is current, a parent's guard covers its children, and the app's `transition` plays between screens of one parent. In Python, `app.guard(screen, check)`
      adds a check, `check(params)` giving `True`, `False` or a route to go to instead; guards that send the app round in a circle are an error after 8 steps.
    see: [guide/windows-and-docks.md, guide/apps-and-screens.md]
