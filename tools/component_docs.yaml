      style: {flex_direction: vertical, gap: 8, width: 240, height: 140, padding: 16}
      children:
        - {widget: Switch, selected: "{{ wifi }}", label: Wi-Fi}
        - {widget: Switch, selected: "{{ dark }}", label: Dark mode, icons: true}
