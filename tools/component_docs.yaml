  - slug: sliders
    title: Slider
    group: Selection and input
    widgets: [Slider, RangeSlider]
    md3: |
      A slider lets the user pick a value from a range by dragging a handle, or with the keyboard.
    built: |
      `widget: Slider`, a Tesserae control: a 4 pixel track, a 20 pixel handle and a 40 pixel state layer in a 48 pixel target. A bound `value` follows the drag, not only its end.
      With a `step` the value snaps to multiples of it from `min`, the keys move by it (else by a hundredth of the range), and `ticks: true` puts a mark at each step: a discrete
      slider (without a `step` there is nothing to mark). `value_indicator: true` shows a bubble with the value over the handle while it is dragged or has the keyboard focus.
      A `max` that is not above `min`, or a `step` that is not positive, is an error.

      Three looks go beyond the standard one. `vertical: true` stands it up: the bottom is `min`, `style.height` is its length and `style.width` the touch target's. `size`
      (`xs`, `s`, `m`, `l` or `xl`) is the Expressive form: a track 16, 24, 40, 56 or 96 pixels thick, in two pieces with a 6 pixel gap either side of a thin 4 pixel handle that
      stands across it. `icon` insets a glyph at the start of the track (it needs a `size` of `s` or larger) in the colour of what it lies on.

      Events: `on_input` while it is dragged (every step), `on_change` once it is let go, and after each key. Dragging captures the pointer, and a press anywhere on the track
      sets the value there. The arrow keys step it (all four, whichever way it lies), Page Up and Down move by ten steps, Home and End go to the ends, and a screen reader can
      increment, decrement and set it. The colour is `style.foreground` and the length is `style.width` (`style.height` when `vertical`); a slider laid out longer or shorter than
      it was built, in a flexible row, takes the room it was given.

      ### Range slider

      `widget: RangeSlider` picks two values, a least and a most, with two handles. It takes the slider's `min`, `max`, `step`, `ticks`, `value_indicator`,
      `vertical`, `size`, `icon`, `label` and `disabled`, and, in place of `value`, two two-way numbers: `low`, the least of the two, and `high`, the most. A `high` below
      `low` is read as `low`.

      The handles never cross: a drag stops at the other handle. Each handle is its own stop for Tab, has its own state layer and focus ring and, for a
      screen reader, is a slider of its own (named from `label`: "Price, minimum" and "Price, maximum"; its reach is up to or down from the other handle).
      The arrow, Page Up and Down keys move the handle that has the focus; Home and End take it to the end of what it may reach. A press on the track moves the
      nearer handle there, and a drag keeps hold of the handle it began on. The track between the handles is `primary`; with a `size` it is three pieces, a gap
      from each handle. `on_input` and `on_change` fire as for a slider; read the values from the bound `low` and `high`.
    usage_view: |
      name: player
      widget: Container
      style: {flex_direction: vertical, gap: 16, width: 280, height: 160, padding: 16}
      children:
        - {widget: Slider, value: "{{ volume }}", min: 0, max: 100, label: Volume, value_indicator: true, style: {width: 240}}
        - {widget: Slider, value: "{{ stars }}", min: 1, max: 5, step: 1, ticks: true, style: {width: 240}}
        - {widget: RangeSlider, low: "{{ cheapest }}", high: "{{ dearest }}", min: 0, max: 500, step: 10, label: Price, style: {width: 240}}
    python: |
      from tesserae.widgets import slider

      volume = slider(app.window, (0xFF, 0xFF, 0xFF, 0xFF), 240, 44, value=0.5)
      volume.on_change(print)
    see: [guide/controls.md]

  - slug: chips
    title: Chips
    group: Selection and input
    views: [Chip, ChipGroup]
    md3: |
      Chips are compact elements for an action, a filter, a piece of input, or a suggestion. **Assist** chips
      start an action, **filter** chips narrow results (and show a check when selected), **input** chips are
      things the user entered, and **suggestion** chips offer a reply or next step.
    built: |
      `widget: Chip` is a view Tesserae ships (`Chip_View.yaml`): 32 pixels tall with 8 pixel corners, as wide as its label. `widget: ChipGroup` is a wrapping row of
      them.

      A chip has a leading 18 pixel `icon`, or `avatar_text`: letters in a 24 pixel circle. A filter or input chip that is `selected` is `secondary_container` with no outline, and
      a filter chip also shows a check in place of its icon. `elevated` swaps the outline for a raised surface. A `removable` chip (an input chip) has a close button: pressing it
      sets `removed` to true and runs `on_remove`. A filter chip is a checkbox to a screen reader and the others are buttons; a disabled chip is dimmed and not focusable.

      A filter chip flips `selected` itself (`flip: false` leaves that to you); `handlers: {on_click: ...}` on the call is what a press does. A `ChipGroup` takes
      `chips` (`{value, label}` and optionally `{icon, avatar_text, disabled}`) and a `mode`: `none` (assist or suggestion chips; the last pressed goes to
      `chosen`), `single` or `multiple` (filter chips; `selected` is the value or the list of values), or `input` (chips with a close, and a field: Enter adds a
      chip, the close removes one, and `chips` is two-way; `entry` is what is typed and `placeholder` its hint). In `none` mode `variant` is `assist` or `suggestion`, and
      `elevated` raises every chip. The group is one Tab stop and the arrow keys move the focus along the chips (in `single` mode the focus carries the choice with it). Not built:
      dragging chips to reorder, and a chip group that scrolls sideways.
    usage_view: |
      name: filters
      widget: Container
      style: {flex_direction: vertical, gap: 16, width: 420, height: 240}
      children:
        - {widget: Chip, label: Share, icon: home, handlers: {on_click: share}}
        - widget: ChipGroup
          mode: multiple
          selected: "{{ filters }}"
          chips: [{value: open, label: Open}, {value: mine, label: Mine}, {value: late, label: Overdue}]
        - {widget: ChipGroup, mode: input, chips: "{{ tags }}", entry: "{{ typed }}"}
    python: |
      from tesserae.widgets import chip

      shipped = chip(app.window, "Shipped", 96, variant="filter", selected=True)

  - slug: text-fields
    title: Text fields
    group: Selection and input
    views: [TextField]
    widgets: [TextInput]
    md3: |
      A text field lets people enter and edit text. Material Design 3 has two kinds: a **filled** field, a tinted container with a line under
      it, and an **outlined** one, a field with a border. The label is the field's name: it sits in the middle as a hint and moves up, smaller,
      when the field has focus or text. Supporting text, a character counter, icons before and after, and an error state with its message
      belong to the field.
    built: |
      `widget: TextField` is a view Tesserae ships (`TextField_View.yaml`) with its look as rules (`TextField_Stylesheet.yaml`). It is built from
      the `TextInput` widget, the bare input, and the nodes around it, so every part has a name a stylesheet can address.

      `text` is two-way: give it a bare reference and typing writes it. `placeholder` shows while the field is empty and has focus (or has no label). `supporting` is help under the
      field, and `error` is a message that gives the field the error look and replaces the supporting text. `leading` and `trailing` are icons (an error replaces the trailing one),
      `prefix` and `suffix` are text around the typing, such as `$` and `USD`, and `counter` shows how many characters are typed, of `max_length` when there is one (`0` is no limit).
      `multiline` makes Enter start a new line; `obscured` makes a password (dots, with a button that shows the text); `read_only` lets the text be selected and copied but not
      changed. `mask` fits what is typed to a pattern (`###-####`: `#` a digit, `A` a letter, `*` either, `\` a literal). `suggestions` is a list of texts: those that contain
      what is typed show in a menu under the field (up to six), pressing one fills the field in, and Escape closes the menu.

      Events: `on_key` for each key pressed in the field, `on_edit` after each edit (once `text` has been written), and `on_submit` for Enter in a field that is not
      multiline.

      **Typing effects.** `typing_effect: flash` tints the characters just typed with the primary colour and lets the tint fade (about a quarter of a second);
      `fade_in` covers them in the background colour and lets that fade, so they seem to appear. Each is drawn exactly over what was inserted (a paste over
      several lines gets a piece on each line), from the geometry the engine reports for the edit. The background `fade_in` uses is the first opaque fill going up from the
      input, else the theme's `surface`. `caret_effect: glide` hides the engine's caret and draws one of Tesserae's own, which eases to each new place in about an eighth
      of a second, stays solid while you type and blinks after a moment, and shows only while the field has the focus. When the app asks for reduced motion there is no
      flash and no fade, and the caret jumps and does not blink. Neither takes the pointer or appears to a screen reader.

      Five more properties tune them, each the field's own to set. `typing_duration` is how long a flash or a fade-in lasts, in milliseconds (260 for a flash and 180 for a fade-in
      when left out; `0` leaves the effect out). `flash_color` is what a flash is tinted with: a theme role or a colour (`tertiary`, `#FF8800`, `primary@50%`), the primary colour
      when left out. `flash_opacity` is how strong a flash starts, `0` to `1` (`0.24` when left out). `glide_duration` is how long the gliding caret takes to reach its new place
      (`120` when left out; `0` makes it jump), and `caret_blink` is how long it is on, then off (`530` when left out; `0` keeps it solid). A number below `0`, or a strength outside
      `0` to `1`, is an error that names the property and the line. The easing is not settable.

      The parts a stylesheet can address are `box`, `label`, `input`, `prefix`, `suffix`, `leading_icon`, `trailing_icon`, `error_icon`,
      `reveal_button`, `reveal_icon`, `indicator` (the line under a filled field), `supporting` and `counter`. The state of a rule is the state of
      the whole field: `focused` is true while anything inside it has the focus, `hovered` while the pointer is over it, and `error` and
      `disabled` read the field's own properties. The label glides between its two places (its position eases in 150 milliseconds; its size changes at once, as the
      engine cannot ease a font size). A filled field has 4 pixel top corners and a square bottom, over its line. The input says it is described by the help line, so a
      screen reader reads that too, and it is invalid while there is an error. Not built: moving into the suggestions with the arrow keys (press one with the pointer), the input method's
      composition drawn by Tesserae (the engine draws the candidate window at the caret), and an exposed dropdown that is a select.
    usage_view: |
      name: signup
      widget: Container
      style: {flex_direction: vertical, width: 360, height: 420, gap: 16, padding: 16}
      children:
        - widget: TextField
          name: email
          label: Email
          leading: search
          text: "{{ email }}"
          error: "{{ email_error }}"
          supporting: We never share it
          handlers: {on_submit: sign_up}
        - widget: TextField
          name: password
          variant: outlined
          label: Password
          obscured: true
          text: "{{ password }}"
        - widget: TextField
          name: bio
          label: About you
          multiline: true
          max_length: 140
          counter: true
          text: "{{ bio }}"
    after: |
      `TextInput` is the bare input, for when the field around it is your own: `text`, `placeholder`, `multiline`, `obscured`, `max_length`,
      `read_only`, `disabled`, `mask`, the typing and caret effects above (`typing_effect`, `caret_effect` and the five that tune them) and the font (`typography_role`,
      `font_family`, `font_size`, `font_weight`); its colour is `style.foreground`. A `TextInput` needs a `style.background` and a `typography_role` (or `font_family`): without them the view does not build.

      ## Changing its look

      Write rules for `TextField` in your app's stylesheet; they sit above the shipped ones, and a `style:` on the node beats every rule for the
      fields it sets.

      ```yaml
      styles:
        - widget: TextField
          part: box
          variant: filled
          style: {background: surface_container_high, corner_radius: 12}
        - widget: TextField
          part: indicator
          state: focused
          style: {background: tertiary}
      ```

      A view named `TextField_View.yaml` in your project replaces the shipped field, and its shipped look with it.
    see: [guide/view-language.md, guide/bindings.md]

  - slug: spin-boxes
    title: Spin box
    group: Selection and input
    views: [SpinBoxField]
    widgets: [SpinBox]
    md3: |
      Material Design 3 has no spin box. Tesserae's is built from MD3's parts: a number field between two 40dp
      icon buttons.
    built: |
      The `SpinBox` kind (`widget: SpinBox` in a view), a Tesserae control: a 64 by 40 pixel number field between two 40 pixel buttons. The buttons, the up and down arrow keys in the
      field and a screen reader's increment and decrement change `value` by `step`; typing a number sets it once it parses and fits `min` to `max`, and leaving the field puts the
      value's text back if what was typed did not. A button whose step would pass a bound is disabled, unless `wrap` is on (it needs `min` and `max`): then a step past one bound
      lands on the other and the buttons never disable. `decimals` fixes how many places show (without it, only as many as the number needs). `prefix` and `suffix` (a currency sign,
      a unit) are shown with the number, and typing may include them or not. `label` is the name for a screen reader.

      Holding a button steps again after 400 milliseconds and then every 80, until it is let go or reaches a bound; Page Up and Page Down step ten at a time.
      `widget: SpinBoxField` is a view Tesserae ships that adds a visible `label` above and a line of `supporting` or `error` text under it (`least` and `most` are its
      bounds, `min` and `max` being reserved names). Not built: a hold that speeds up the longer it is held, and a spin box in a vertical arrangement.
    usage_view: |
      name: order
      widget: Container
      style: {flex_direction: vertical, gap: 16, width: 320, height: 240}
      children:
        - {widget: SpinBox, value: "{{ count }}", min: 0, max: 10, label: Count}
        - {widget: SpinBoxField, label: Weight, value: "{{ weight }}", least: 0, most: 50, step: 0.5, decimals: 1, suffix: " kg", supporting: Up to 50}
    python: |
      from tesserae.widgets import spin_box

      quantity = spin_box(app.window, 1, min=0, max=10)
    see: [guide/controls.md]

  - slug: date-pickers
    title: Date picker
    group: Selection and input
    views: [DatePicker, DatePickerDay]
    md3: |
      A date picker lets the user pick a date from a month grid. Today is outlined, the chosen day is a filled
      circle, and days of the neighbouring months are dimmed.
    built: |
      Two views Tesserae ships: `DatePickerDay` (one day, in all its states) and `DatePicker` (the modal dialog).

      `DatePicker`'s `open` is two-way (Escape and a press on the scrim close it). `date` is text, `year-month-day` ("2026-10-09", or empty for none), also two-way, and it changes only
      when OK is pressed. The days before `earliest` and after `latest` are disabled, `week_starts` is `sunday` (the default) or `monday`, and `on_ok` is called after OK.

      The dialog shows the chosen date in `headline_large` and a keyboard button that swaps the grid for a typed field (`####-##-##`; text that is not a real day is left out), the month with arrows between months, the
      weekday initials, six weeks of days, and Cancel and OK. Today is outlined, the chosen day is a `primary` circle, and the days of the months either side are faint and move
      the view to their month when pressed. The arrow keys move around the grid. A `DatePickerDay` has `day`, `selected`, `today`, `outside` and `disabled`. The dates are worked out with
      the expression language's `date_add_days`, `date_weekday`, `days_in_month`, `format_date` and `current_date`, which are there for any view. Not built: a range picker,
      a docked picker under a field, month and year selectors, Page Up and Page Down by month, and the names of the months and days in another language.
    usage_view: |
      name: booking
      widget: Container
      style: {width: 480, height: 640}
      children:
        - widget: DatePicker
          open: "{{ choosing }}"
          date: "{{ day }}"
          earliest: "2026-01-01"
        - {widget: DatePickerDay, day: "7", selected: true}
    python: |
      from tesserae.widgets import date_picker_day

      day = date_picker_day(app.window, 7, selected=True)

  - slug: time-pickers
    title: Time picker
    group: Selection and input
    views: [TimePicker, PeriodSelector]
    widgets: [TimePickerDial]
    md3: |
      A time picker lets the user choose an hour and a minute on a dial, with an AM/PM selector in a 12-hour
      format.
    built: |
      Four pieces. `TimePickerDial` is a Tesserae control (`widget: TimePickerDial`): `hour`, `minute` and `mode` (`hour` or `minute`; letting go on an hour moves on to the
      minutes unless `auto_advance` is off; the arrow keys step the hour by one or the minute by five, and a screen reader can increment and decrement it). `PeriodSelector` is a view: two 40 pixel halves, `period` `AM` or `PM` (two-way), with an `on_change` handler for after a choice; it is one Tab stop and the up and down arrows move and choose.
      `TimeInput` is a view: an hour field, a colon, a minute field and, in 12-hour time, a period selector, where `hour` and `minute` are two-way and a number that does
      not fit is left out (the fields are filled from the time when they appear). `TimePicker` is the dialog of Material 3.

      `TimePicker`'s `open` is two-way (Escape and a press on the scrim close it). `hour` (0 to 23) and `minute` are two-way and change only when OK is pressed; Cancel, Escape and the
      scrim leave them. `twelve` (the default) is 12-hour time with a dial and a period selector; `twelve: false` opens straight on the typed fields, with no dial and no keyboard
      button. `on_ok` is called after OK.

      The picker shows the time as an hour and a minute you press to choose which the dial sets, the period selector, the 256 pixel dial, a keyboard button that
      swaps the dial for the typed fields (and back), and Cancel and OK. Reopening it starts from the time as it then is. Not built: a 24-hour dial with an inner ring,
      limits on the times that can be chosen, and the times as a locale writes them.
    usage_view: |
      name: alarm
      widget: Container
      style: {width: 480, height: 520}
      children:
        - widget: TimePicker
          open: "{{ choosing }}"
          hour: "{{ alarm_hour }}"
          minute: "{{ alarm_minute }}"
          on_ok: alarm_set
        - widget: TimeInput
          hour: "{{ alarm_hour }}"
          minute: "{{ alarm_minute }}"
        - {widget: PeriodSelector, period: "{{ half }}"}
    python: |
      from tesserae.widgets import time_picker_dial

      dial = time_picker_dial(app.window, hour=9, minute=30)
    see: [guide/controls.md]

  - slug: segmented-buttons
    title: Segmented buttons
    group: Selection and input
    views: [SegmentedButton]
    md3: |
      A segmented button is a row of two to five connected options, for one choice or several.
    built: |
      `widget: SegmentedButton` is a view Tesserae ships (`SegmentedButton_View.yaml`): one outlined pill (40 pixels tall, a 1 pixel `outline`, fully
      rounded) of segments with a line between them.

      Each segment is `{value, label}` and optionally `{icon, disabled}`; `options` can be an expression, and follows its Signals. `selected` is the chosen value (with `multiple`, the
      list of chosen values) and a press writes it back. A chosen segment is `secondary_container` with a check that takes the place of its icon, and a segment of its own `disabled`,
      or all of them with the button's `disabled`, is dimmed and cannot be pressed. Single choice is a radio group: one Tab stop (the chosen segment), and the arrow keys
      move the choice, skipping a disabled segment; multiple choice is a group of toggles, each its own Tab stop with the arrows moving focus only. The look is in the view, because each segment's state is its own: write a `SegmentedButton_View.yaml` in your project to change it.
    usage_view: |
      name: calendar
      widget: Container
      style: {flex_direction: vertical, gap: 16, width: 360, height: 140, padding: 16}
      children:
        - widget: SegmentedButton
          selected: "{{ range }}"
          options:
            - {value: day, label: Day}
            - {value: week, label: Week, icon: home}
            - {value: month, label: Month}
        - widget: SegmentedButton
          multiple: true
          selected: "{{ styles }}"
          options: [{value: bold, label: Bold}, {value: italic, label: Italic}]
    python: |
      from tesserae.widgets import segmented_button

      view = segmented_button(app.window, ["Day", "Week", "Month"], selected=0)
      many = segmented_button(app.window, ["Bold", "Italic"], multi=True, selected=[0])

  - slug: time-input
    title: Time input
    group: Selection and input
    views: [TimeInput]
    md3: |
      A time input field is a numeric field for the hour or the minute, used in the time picker's keyboard mode.
    built: |
      `widget: TimeInput` is a view Tesserae ships (`TimeInput_View.yaml`): two outlined `TextField`s, 96 pixels wide, for the hour and the minute, a colon between them and, in
      12-hour time, a `PeriodSelector`. `hour` (0 to 23) and `minute` are two-way. The fields take two digits (`mask: "##"`); a number that does not fit (1 to 12 in 12-hour
      time, 0 to 23 otherwise, and 0 to 59 for the minute) is left out until it does. The fields are filled from the time when the input appears and follow what is typed after
      that. The time picker shows it in its keyboard mode.

      In Python, `time_input_field` is one numeric field of Material 3's: 96 by 72 pixels, a centred two-digit numeral, `unit` `hour` or `minute`. Its `value` is a `Signal`;
      typing a number in range sets it, and the up and down arrows (and a screen reader's increment and decrement) step it, wrapping.
    usage_view: |
      name: alarm_time
      widget: Container
      style: {width: 360, height: 120, padding: 16}
      children:
        - {widget: TimeInput, hour: "{{ alarm_hour }}", minute: "{{ alarm_minute }}", twelve: false}
