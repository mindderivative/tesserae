# What the component pages say, by hand: the one thing in them a tool can't read from the code.
# `tools/generate_component_docs.py` adds each fragment's YAML and its stylesheet, and the parts and
# parameters, from the files themselves.
#
# groups:        the collapsing tree, in order.
# components:    one page each: slug, title, group, views (the shipped views it is built from), widgets (the
#                built-in widgets), md3 (what it is in Material Design 3), built (how Tesserae makes it),
#                usage_view (an example in a view), python (the same in code), shares, see (guide pages).
groups:
  - Actions
  - Communication
  - Containment
  - Navigation
  - Selection and input
  - Content
  - Beyond MD3
  - Windows and docking

components:
  # -- Actions -----------------------------------------------------------------------------------
  - slug: buttons
    title: Buttons
    group: Actions
    views: [Button]
    md3: |
      Buttons let people take an action with one tap. Material Design 3 has five, in order of emphasis: **filled**
      for a screen's one main action, **filled tonal** and **elevated** for important but secondary ones,
      **outlined** for medium emphasis, and **text** for the lowest: dialogs, cards and toolbars. A button is 40dp
      high and fully rounded, and its label is in the *label large* type style.
    built: |
      `widget: Button` is a view Tesserae ships (`Button_View.yaml` and `Button_Stylesheet.yaml`). One widget has all five types, in five sizes. It is as wide
      as its label and icons, and `handlers: {on_click: ...}` on the call is what a press does; Enter or Space on a focused button does the same.

      A toggle (`toggle: true`) flips `selected` on each press, and its colours and shape swap while it is on; with `flip: false` the caller decides when it flips
      (a button group's buttons are made so). While `loading` a spinner takes the icon's place and the button does not respond. A disabled button fades as a whole.

      The label is `label_large` at `xs` and `s`, `title_medium` at `m`, `headline_small` at `l` and `headline_large` at `xl`; the gap between the parts is 4, 8, 8, 12 and 16 pixels. Padding
      at the default size is 24 pixels each side (16 on the side with an icon, or the spinner; a text button 12); `xs` has 12, `m` 24, `l` 48 and `xl` 64 whatever is in the button.
      The container is a pill and, while pressed, squares off; a toggle that is
      on takes the other shape. A filled or tonal button lifts to level 1 when hovered, an elevated one rests at level 1 and lifts to 2. The state layer, ripple and
      focus ring are the node's interaction. The look is in the stylesheet: write a `Button_Stylesheet.yaml` in your project to change it. Not built: the
      container colour at 12% for a disabled filled button (a disabled button fades as a whole).
    usage_view: |
      name: actions
      widget: Container
      style: {flex_direction: horizontal, gap: 12, padding: 16, align_content: center}
      children:
        - {widget: Button, label: Save, icon: home, handlers: {on_click: save}}
        - {widget: Button, label: Draft, variant: outlined}
        - {widget: Button, label: Mute, variant: tonal, toggle: true, selected: "{{ muted }}"}
        - {widget: Button, label: Sync, variant: text, loading: "{{ syncing }}"}
    python: |
      from tesserae.widgets import button

      save = button(app.window, "Save", 120, 40, variant="filled", on_click=viewmodel.save)
    see: [guide/widget-catalog.md, guide/interaction.md]

  - slug: button-groups
    title: Button groups
    group: Actions
    views: [ButtonGroup]
    md3: |
      A button group lays related buttons side by side, with an even gap, so they read as one set of choices.
    built: |
      `widget: ButtonGroup` is a view Tesserae ships (`ButtonGroup_View.yaml`): `Button`s side by side, one for each of `items`.

      The `mode` says what the buttons are: `none` (the default) is a row of actions, and the value of the one last pressed goes to `chosen` (nothing needs to be bound);
      `single` is a choice of one, with `selected` its value; `multiple` is a set, with `selected` the list of chosen values. Each item is `{value, label}` and optionally
      `{icon, disabled}`. `variant` and `size` are `Button`'s and go to every button. By default the buttons stand 8 pixels apart; `connected: true` makes the gap 2
      pixels with 4 pixel inner corners, and `orientation: vertical` makes a column.

      In `single` mode a chosen button is a toggle that is on, and the arrow keys move the choice; `multiple` toggles each button and the arrows only move the
      focus. There is one Tab stop. Not built: the pressed button widening and its neighbours giving way, and an overflow button.
    usage_view: |
      name: calendar
      widget: Container
      style: {flex_direction: vertical, gap: 12, padding: 16, width: 360, height: 160}
      children:
        - widget: ButtonGroup
          mode: single
          connected: true
          variant: tonal
          selected: "{{ range }}"
          items: [{value: day, label: Day}, {value: week, label: Week}, {value: month, label: Month}]
        - widget: ButtonGroup
          chosen: "{{ last_action }}"
          items: [{value: copy, label: Copy, icon: home}, {value: paste, label: Paste}]
    python: |
      from tesserae.widgets import button_group

      group = button_group(app.window, ["Day", "Week", "Month"], 90, 40, on_click=viewmodel.pick)

  - slug: split-buttons
    title: Split buttons
    group: Actions
    views: [SplitButton]
    md3: |
      A split button joins a main action to a menu of related ones: the leading part does the usual thing, and the
      trailing chevron opens the others.
    built: |
      `widget: SplitButton` is a view Tesserae ships (`SplitButton_View.yaml`): two `Button`s 2 pixels apart and a `Menu` for the trailing one. One widget covers all five types.

      The main part has the `label` and an optional `icon` and runs `on_click`; the trailing part opens a `Menu` of `items` (rows as `Menu` takes them), and the `value`
      of the row pressed goes to `chosen`. `variant` and `size` are `Button`'s and both parts take them.

      The inner corners are small (4 pixels) and the outer ones round; while the menu is open the trailing part is round on every corner and its chevron is turned over. Each part is its
      own Tab stop; the trailing part says it is expanded while its menu shows. Arrow-down on either part opens the menu and moves the focus to its first row (a press opens it
      without moving the focus). Not built: a toggle form.
    usage_view: |
      name: compose
      widget: Container
      style: {width: 420, height: 240, padding: 16}
      children:
        - widget: SplitButton
          label: Send
          icon: send
          on_click: send_now
          chosen: "{{ when }}"
          items:
            - {value: later, label: Send later}
            - {value: draft, label: Save as draft}
    python: |
      from tesserae.widgets import split_button

      send = split_button(app.window, "Send", 160, 40, variant="filled")

  - slug: icon-buttons
    title: Icon buttons
    group: Actions
    views: [IconButton]
    md3: |
      An icon button is an action shown as a glyph alone. Like buttons it has four emphases: standard (no
      container), filled, filled tonal and outlined. It is 40dp, with a 48dp touch target.
    built: |
      `widget: IconButton` is a view Tesserae ships (`IconButton_View.yaml`): one widget for the four types, in five sizes and three widths. The `label`
      names it for a screen reader and is its tooltip. `handlers: {on_click: ...}` on the call is what a press does.

      The glyph is 20, 24, 24, 32 or 40 pixels for the five sizes. `width_kind` makes it as wide as it is tall (`default`), or narrower or wider (a 40 pixel button is 32
      pixels wide when `narrow` and 52 when `wide`). A toggle (`toggle: true`) flips `selected` on a press, and the `selected_icon`, the colours and the shape show while it is on. The
      glyph morphs into the other over 200 ms when the two are both closed shapes or both open lines (`add` and `remove` do); other pairs, such as `play` and `pause`, switch partway through
      instead. `tint` sets a standard button's icon colour to a colour role. A button with a `label` shows it as a tooltip, and without one there is no tooltip.

      The state layer, ripple and focus ring are the node's interaction; a pressed circle squares off. Not built: the 12% container of a disabled filled
      button, and the 48 pixel touch target around a 40 pixel button.
    usage_view: |
      name: toolbar
      widget: Container
      style: {flex_direction: horizontal, gap: 8, padding: 16}
      children:
        - {widget: IconButton, icon: settings, label: Settings, handlers: {on_click: open_settings}}
        - {widget: IconButton, icon: home, selected_icon: search, label: Favourite, variant: filled, toggle: true, selected: "{{ favourite }}"}
    python: |
      from tesserae.widgets import icon_button

      settings = icon_button(app.window, "settings", 40, variant="standard")

  - slug: fabs
    title: Floating action buttons
    group: Actions
    views: [Fab]
    md3: |
      A floating action button (FAB) is the screen's most important action, as an icon in a prominent container.
      There are four colours (primary, secondary, tertiary and surface) and three sizes: small (40dp), the
      default (56dp) and large (96dp).
    built: |
      `widget: Fab` is a view Tesserae ships (`Fab_View.yaml`): one widget for the four colours and three sizes, and for the extended form too (give it a
      `label`).

      The glyph is 24 pixels, 36 on a large FAB, and the corners are 12, 16 and 28 pixels for the three sizes. A collapsed extended FAB shows only its icon, and its
      label becomes its tooltip; the label is also the accessible name.

      It rests at elevation level 3, lifts to 4 when hovered and settles to 3 when pressed. To collapse as a list scrolls down and extend as it scrolls up, bind
      `collapsed: "{{ way == 'down' }}"` to the `scroll_direction` of the list. Not built: easing the collapse and the extend (the width goes between a number and `auto`,
      which the engine does not animate, so the FAB changes shape at once), and the FAB menu.
    usage_view: |
      name: inbox
      widget: Container
      style: {flex_direction: vertical, width: 360, height: 480}
      children:
        - widget: ScrollView
          scroll_direction: "{{ way }}"
          style: {height: 400}
          children: [{widget: Text, text: Messages, typography_role: body_medium, style: {foreground: on_surface}}]
        - widget: Fab
          icon: add
          label: Compose
          collapsed: "{{ way == 'down' }}"
          handlers: {on_click: compose}
    python: |
      from tesserae.widgets import fab

      add = fab(app.window, "add", size="default", variant="primary")

  - slug: extended-fabs
    title: Extended FABs
    group: Actions
    shares: fabs
    md3: |
      An extended FAB is a FAB with a text label, for a main action that an icon alone wouldn't explain.
    built: |
      It is the same `widget: Fab` (see Floating action buttons) given a `label`: 56 tall, as wide as its label, with 16 pixels before the icon and 20
      after the text. Give no `icon` for a text-only one.
    usage_view: |
      name: inbox
      widget: Container
      style: {width: 240, height: 120}
      children:
        - {widget: Fab, label: New, icon: add, variant: secondary, handlers: {on_click: create}}
    python: |
      from tesserae.widgets import extended_fab

      new = extended_fab(app.window, "New", 120, icon="add", variant="primary")

  # -- Communication -----------------------------------------------------------------------------
  - slug: badges
    title: Badges
    group: Communication
    views: [Badge]
    md3: |
      A badge shows that something has news. The small one is a dot, and the large one carries a short count or
      text. It sits on the corner of what it describes.
    built: |
      `widget: Badge` is a view Tesserae ships (`Badge_View.yaml`) with its look as rules (`Badge_Stylesheet.yaml`): a 6 pixel `error` dot, or with a
      `value` a 16 pixel pill in `label_small` on `on_error`, at least 16 wide and growing with its text.

      A `value` that is a number over `limit` shows as the limit and a plus (`999+` by default), and `show: "{{ unread > 0 }}"` hides a zero count. With
      `anchored: true` the children are the host, and the badge sits over the host's top right corner.

      Anchored, a dot overlaps the corner by 4 and a pill starts 12 in from the corner and 4 above it. The badge is hidden from a screen reader: put the
      count in the host's label ("Inbox, 3 unread"). The parts a stylesheet can address are `mark` and `label`.
    usage_view: |
      name: nav
      widget: Container
      style: {flex_direction: horizontal, gap: 24, width: 200, height: 60, padding: 16}
      children:
        - widget: Badge
          value: "{{ unread }}"
          show: "{{ unread > 0 }}"
          anchored: true
          children:
            - {widget: Icon, icon: email, style: {width: 24, height: 24, foreground: on_surface}}
        - widget: Badge
          anchored: true
          children:
            - {widget: Icon, icon: home, style: {width: 24, height: 24, foreground: on_surface}}
    python: |
      from tesserae.widgets import badge

      unread = badge(app.window, "3")

  - slug: progress-indicators
    title: Progress indicators
    group: Communication
    widgets: [LinearProgress, CircularProgress, LoadingIndicator]
    md3: |
      Progress indicators show that something is happening. **Determinate** ones fill as a value from 0 to 1
      grows; **indeterminate** ones keep moving when there's no value to show. The loading indicator is MD3's
      shape-morphing one, for short waits.
    built: |
      Each is a Tesserae control (`tesserae.controls`), not a drawing of `tre`'s: `widget: LinearProgress`, `widget: CircularProgress` and
      `widget: LoadingIndicator`. Leave `value` out, or let an expression give nothing, for a wait with no end; a number from 0 to 1 is determinate and
      eases to each new value.

      A bar is 240 pixels long and 4 thick, and a ring is 48 across, unless the call's `style:` gives a `width`; the colour is `style.foreground`, `primary` by default. A bar
      has a `surface_container_highest` track behind it and a ring has none, until `track` names a colour role; a stop dot at the end of the bar's track is opt-in
      (`stop_indicator`), as is a `buffer` (how much has loaded, 0 to 1, a lighter bar behind the value). With a `track`, a determinate ring and its track are a gap apart
      (4 pixels between the rounded ends), as in MD3. A `wavy` bar is taller than its `thickness` by the wave's height (6 pixels), and a wavy ring's arc is a wave round
      a plain track. A screen reader hears a progress bar with its value as a percentage, or as busy when there is none. An app that reduces motion gets a still bar and arc
      instead of the endless motion. The two bars of `two_bar` keep their widths as they cross, so the sweep approximates MD3's, whose bars grow and shrink; the wave's size
      and speed and the thicker sizes are written from memory of the spec and have not been checked against it.
    usage_view: |
      name: upload
      widget: Container
      style: {flex_direction: vertical, gap: 16, width: 280, height: 140, padding: 16}
      children:
        - {widget: LinearProgress, value: "{{ sent }}", buffer: "{{ queued }}", label: Uploading, style: {width: 240}}
        - {widget: LinearProgress, style: {width: 240}}                  # no value: a wait with no end
        - {widget: CircularProgress, value: "{{ sent }}", track: secondary_container}
        - {widget: LinearProgress, value: "{{ sent }}", wavy: true, thickness: 4, style: {width: 240}}
    python: |
      from tesserae.widgets import linear_progress

      upload = linear_progress(app.window, 240, value=0.4)
      upload.value.set(0.8)
    see: [guide/controls.md]

  - slug: snackbars
    title: Snackbars
    group: Communication
    views: [Snackbar, SnackbarHost]
    md3: |
      A snackbar briefly tells the user about a process that has happened or will happen, at the bottom of the
      window, and may offer one action. It goes away by itself.
    built: |
      Two views Tesserae ships: `Snackbar` (one message) and `SnackbarHost` (several, one after another).

      A `Snackbar` shows while `open` is true and writes `false` back when it closes. It closes itself after `duration` milliseconds (4000 by default; 0 keeps it until it is closed),
      and the pointer over it holds the time off. The `action` is a text button after the message: pressing it runs `on_action` and closes the snackbar. `closable` adds a close
      button, and `on_close` is called when it closes however it closes. It is 344 to 560 pixels wide (`width`), 16 from the window's edge (`margin`), at the start or `centered`.

      It is `inverse_surface` at level 3 with 4 pixel corners, 48 pixels tall (68 for two lines), over the content, not modal, and takes no focus; a screen reader hears it
      as a polite alert. A `SnackbarHost` takes `messages` (`{message}` and optionally `{action, value, id, duration}`), shows the first, drops it when it closes
      and shows the next; add to the list from anywhere that can write it; `chosen` is the `value` of the action pressed. An `Overlay` has a `timeout`
      and an `on_dismiss` handler, which is how this is made. Not built: swipe to dismiss, and lifting above a FAB or a bottom bar.
    usage_view: |
      name: notes
      widget: Container
      style: {width: 480, height: 320}
      children:
        - widget: SnackbarHost
          messages: "{{ toasts }}"
          chosen: "{{ undo }}"
        - widget: Snackbar
          open: "{{ saved }}"
          message: Note saved
          action: Undo
          on_action: undo_save
    python: |
      from tesserae.widgets import snackbar

      bar = snackbar(app.window, "Saved", 280, action_label="Undo", on_action=viewmodel.undo)
      bar.open()
    see: [guide/overlays.md]

  - slug: tooltips
    title: Tooltips
    group: Communication
    md3: |
      A tooltip names or explains a control when the pointer rests on it, or it has keyboard focus.
    built: |
      Any node takes a `tooltip:`. A plain one is text on the inverse surface; a rich one has a `title`, up to two `actions` and a `placement`
      (`below`, `above`, `start`, `end`, or a corner: `top_start`, `top_end`, `bottom_start`, `bottom_end`, `center`, which puts the middle of the tooltip on that point and is not flipped), is a raised surface the pointer can move onto, and closes when an action is pressed. It shows after the
      pointer rests for `delay` (500 ms by default), at once on keyboard focus (focus that a click gave does not count), or after a touch held in place; Escape, a press, or leaving
      closes it. The text also names the node for a screen reader, unless the node has a description of its own. Not built: reaching the actions by keyboard.
    usage_view: |
      name: file
      widget: Container
      style: {width: 240, height: 120, padding: 24}
      children:
        - widget: Button
          label: Delete
          tooltip: {title: Delete, text: Removes the file for good, actions: [{label: Undo, on_click: undo}]}
        - widget: Button
          label: Save
          variant: tonal
          tooltip: Save the file
    python: |
      from tesserae.widgets import tooltip

      tip = tooltip(app.window, "Save the file", anchor=save.node)
    see: [guide/overlays.md]

  # -- Containment -------------------------------------------------------------------------------
  - slug: cards
    title: Cards
    group: Containment
    views: [Card]
    md3: |
      A card holds content and actions about one subject. It comes **elevated** (a shadow), **filled** (a
      higher surface) or **outlined** (a border). All have a medium (12dp) corner radius.
    built: |
      `widget: Card` is a view Tesserae ships (`Card_View.yaml`): a surface with 12 pixel corners that is as tall as what is in it.

      The `variant` is a shadow (`elevated`, level 1), a higher surface (`filled`) or a 1 pixel `outline_variant` border (`outlined`). The `headline` is `title_large`, the `subhead`
      `title_small` and the `text` `body_medium`, with 16 pixels around them. A `media` picture runs across the top, clipped to the corners (160 pixels tall unless `media_height` says
      otherwise). An `actionable` card is one pressable surface: a state layer, a ripple, Enter, and a lift to level 2 for the elevated one when hovered. A `selected` card is
      `secondary_container` (an outlined one gets an `outline` border instead); the caller decides when, as in `on_click: "picked = not picked"`. A `disabled` card is dimmed.

      Your own content goes in the default slot, after the text, and buttons in the `actions` slot (a row at the end). `handlers: {on_click: ...}` on the call is
      what a press of an actionable card does. A plain card is a group and takes no focus. Not built: dragging and swiping a card, and the dragged state.
    usage_view: |
      name: trips
      widget: Container
      style: {flex_direction: horizontal, gap: 16, padding: 16, width: 560, height: 360}
      children:
        - widget: Card
          headline: Paris
          subhead: Three days
          text: Flights and a hotel.
          media: paris.png
          style: {width: 240}
          children:
            - {widget: Button, label: Book, variant: text, slot: actions}
        - {widget: Card, variant: outlined, headline: Rome, actionable: true, selected: "{{ picked }}", style: {width: 240}, handlers: {on_click: pick}}
    python: |
      from tesserae.widgets import card

      summary = card(app.window, 240, 120, variant="elevated")

  - slug: dialogs
    title: Dialogs
    group: Containment
    views: [Dialog]
    md3: |
      A dialog interrupts to ask for a decision or give needed information. It has a headline, supporting text and
      up to two actions, on a raised surface over a scrim, and blocks what is behind it.
    built: |
      `widget: Dialog` is a view Tesserae ships (`Dialog_View.yaml`): a modal [`Overlay`](../guide/view-language.md#overlays) holding a raised panel (28 pixel
      corners, 24 of padding) with an optional icon, a headline, supporting text, your own content and text-button actions.

      `open` is two-way: Escape and a press on the scrim write `false` back, unless `dismissible` is off, when only an action closes it. Each of the `actions` is `{label, value}`
      and optionally `{variant}` (a text button unless it says otherwise); pressing one closes the dialog and writes its `value` to `result`, which stays empty when the dialog was
      dismissed. The panel is `width` wide, held between 280 and 560 pixels (312 by default), and the content scrolls beyond `max_height` (480). `fullscreen` is the full-screen
      form: the panel fills the window on `surface`, with a close button, the headline and the actions in a 56 pixel bar along the top, and the content scrolling under it.

      Children are the content, after the supporting text. When the content scrolls, a line shows above the actions. Actions stack when they do not fit
      one row. A screen reader hears a `dialog` named by the headline (tre has no `alertdialog` role). In the full-screen form the close button writes
      `false` to `open` with no result, the actions sit in the bar instead of under the content (MD3 has one confirming action there), and a line shows under
      the bar once the content has scrolled; use it where the window is `compact` (`fullscreen: "{{ app.width_class == 'compact' }}"`). Not built: focusing a
      form dialog's first field.
    usage_view: |
      name: files
      widget: Container
      style: {flex_direction: vertical, width: 480, height: 360}
      children:
        - widget: Dialog
          open: "{{ confirming }}"
          result: "{{ choice }}"
          headline: Discard draft?
          text: This cannot be undone.
          icon: home
          actions:
            - {label: Cancel, value: cancel}
            - {label: Discard, value: discard}
    python: |
      from tesserae.widgets import dialog

      confirm = dialog(app.window, "Discard changes?", "Your edits will be lost.", 320, 200,
                       actions=[("Cancel", None), ("Discard", viewmodel.discard)])
      confirm.open()
    see: [guide/overlays.md]

  - slug: dividers
    title: Dividers
    group: Containment
    views: [Divider]
    md3: |
      A divider is a thin line that groups and separates content in lists and containers. It spans the whole length (**full-width**), starts
      16 dp in from the start (**inset**), or is 16 dp in from both ends (**middle inset**), and is horizontal or vertical.
    built: |
      `widget: Divider` is a view Tesserae ships (`Divider_View.yaml`) with its look as rules (`Divider_Stylesheet.yaml`): a line in the
      `outline_variant` colour that fills the length it is in, and is a `separator` to a screen reader.

      The `variant` says how much of the ends it keeps clear (`full` by default; `inset` leaves 16 pixels at the start, `middle` 16 at both ends). A `horizontal` divider fills the
      width it is in and a `vertical` one the height (in a container that does not set `align_content`, which would size it to its content, and so to nothing); it is 1 pixel thick unless `thickness` says.
    usage_view: |
      name: settings
      widget: Container
      style: {flex_direction: vertical, width: 320, height: 160}
      children:
        - {widget: Text, text: Wi-Fi, typography_role: body_large, style: {foreground: on_surface}}
        - {widget: Divider, variant: inset}
        - {widget: Text, text: Bluetooth, typography_role: body_large, style: {foreground: on_surface}}
        - {widget: Divider}
    after: |
      ## Changing its look

      Write rules for `Divider` in your app's stylesheet; they sit above the shipped ones, and a `style:` on the node beats every rule for the
      fields it sets.

      ```yaml
      styles:
        - widget: Divider
          style: {background: outline}
      ```

      A view named `Divider_View.yaml` in your project replaces the shipped divider, and its shipped look with it.
    python: |
      from tesserae.widgets import divider

      rule = divider(app.window, 240)

  - slug: lists
    title: Lists
    group: Containment
    views: [ListItem]
    md3: |
      A list is a column of rows, each a headline with optional leading and trailing content and supporting text.
    built: |
      `widget: ListItem` is a view Tesserae ships (`ListItem_View.yaml`): a row as wide as its place, 56, 72 or 88 pixels tall by its lines. A list is a
      container of them (or a `for:`, or a `VirtualList`, over your data).

      The `headline` is the first line, `supporting` the line under it and `overline` a small line above it; they set the height (56 for one line, 72 for two, 88 for three) unless
      `lines` says. Before the text goes a 24 pixel `leading_icon`, a 40 pixel circle holding the letters of `leading_text`, or a 56 pixel `leading_image`; after it a `trailing_text` or a
      `trailing_icon`. With `selectable` a press flips `selected`, and a selected row is `secondary_container`. `divider` draws a line along the bottom edge.

      Your own content goes in the `leading` and `trailing` slots (`slot: trailing` on a child): a switch, a checkbox, a button. `handlers: {on_click: ...}` on
      the call is what a press does. A section's header can hold the top of a `ScrollView` while its rows scroll past: give it `style: {sticky: 0}`. Not built: swipe actions, drag to
      reorder, and the dragged state.
    usage_view: |
      name: mail
      widget: Container
      style: {flex_direction: vertical, width: 360, height: 300}
      children:
        - {widget: ListItem, headline: Inbox, supporting: 12 unread, leading_icon: home, trailing_text: 5m, divider: true, handlers: {on_click: open_inbox}}
        - widget: ListItem
          headline: Wi-Fi
          supporting: Connected
          children:
            - {widget: Switch, slot: trailing, selected: "{{ wifi }}"}
    python: |
      from tesserae.widgets import list_, list_item

      rows = list_(app.window, [list_item(app.window, name) for name in ("Inbox", "Sent", "Drafts")], width=320)
    see: [guide/repeater.md, guide/effects.md]

  - slug: side-sheets
    title: Side sheets
    group: Containment
    views: [SideSheet, SideSheetModal, SideSheetPanel]
    md3: |
      A side sheet holds secondary content beside the main content. A **standard** one shares the window with it;
      a **modal** one covers it over a scrim and must be dismissed.
    built: |
      Three views Tesserae ships: `SideSheet` (standard, inline), `SideSheetModal` (over a scrim) and `SideSheetPanel` (the inside they share).

      `open` is two-way: the close button writes `false`, and so do Escape and a press on the scrim of a modal sheet. The header has a `title_large` `title`, a back button (`back: true`)
      that runs `on_back`, and a close button (`closable`, on by default). The sheet is `width` wide, held between 256 and 400 pixels (360 by default). A modal sheet also takes `side`
      (`end`, the default, or `start`: the edge it comes from) and `dismissible` (off, Escape and the scrim do not close it).

      Children are the content, which scrolls (a line shows over the actions once it has); children with `slot: actions` are the buttons, in a row at the bottom right.
      A standard sheet is inline: it takes room from the content while `open` and its width eases open and shut; put it first in its row for the start side and last for
      the end. A modal sheet is `surface_container_low` at level 1 with 16 pixel corners on the open side, over the content. Not built: the detached sheet, and the modal
      sheet sliding in from the edge.
    usage_view: |
      name: editor
      widget: Container
      style: {flex_direction: horizontal, width: 720, height: 420}
      children:
        - {widget: Container, name: page, style: {flex: fill, height: 100%}}
        - widget: SideSheet
          open: "{{ filtering }}"
          title: Filters
          children:
            - {widget: Switch, label: Only mine}
            - {widget: Button, slot: actions, label: Apply, handlers: {on_click: apply}}
    python: |
      from tesserae.widgets import side_sheet

      sheet = side_sheet(app.window, 280, modal=True)
      sheet.open()
    see: [guide/overlays.md]

  - slug: accordions
    title: Accordions
    group: Containment
    views: [Accordion, AccordionGroup]
    md3: |
      Material Design 3 has no accordion of its own. Tesserae's is built in MD3's terms: a list row with a chevron
      that turns when the section opens.
    built: |
      Two views Tesserae ships. `widget: Accordion` is one section: a 56 pixel header button (the `title` and a chevron that turns over in 200 milliseconds) and, while `expanded`
      (two-way), its content (the children). `widget: AccordionGroup` makes several behave as one set with dividers between them.

      A press, Enter or Space on the header toggles `expanded`, and `on_toggle` is called after it. A `disabled` section is dimmed and does not toggle. An `AccordionGroup` takes
      `items`, each `{value, title, text}` (the text is the section's content; for more than text, write the `Accordion` sections yourself); `mode` is `single` (the default: opening one
      closes the rest) or `multiple`, and `open` is the value that is open (empty for none), or with `multiple` the list of values that are.

      A screen reader hears a button that says whether it is expanded and what it controls; the content is hidden from it while closed and its parts are not built, so they
      take no Tab stop. The up and down arrows move between the headers, and Home and End go to the first and last. Not built: the content's height easing open
      (the engine cannot ease a height to `auto`).
    usage_view: |
      name: faq
      widget: Container
      style: {flex_direction: vertical, gap: 16, width: 420, height: 360}
      children:
        - widget: Accordion
          title: Details
          expanded: "{{ showing }}"
          children:
            - {widget: Text, text: More about it, typography_role: body_medium, style: {foreground: on_surface_variant}}
        - widget: AccordionGroup
          open: "{{ which }}"
          items:
            - {value: a, title: Shipping, text: Two days.}
            - {value: b, title: Returns, text: Thirty days.}
    python: |
      from tesserae.widgets import accordion_header

      details = accordion_header(app.window, "Details", expanded=False, width=320)

  - slug: trees
    title: Trees
    group: Containment
    views: [Tree, TreeNode, TreeLevel]
    md3: |
      Material Design 3 has no tree view; this is MD3's list row, indented by depth, with a chevron on the rows
      that open.
    built: |
      Views Tesserae ships: `Tree` (the whole tree from data), `TreeNode` (one row, a branch with a chevron or a leaf) and `TreeLevel` (the rows of one level, which calls itself for
      the children of an open branch).

      The `nodes` are rows, `{value, label}` and optionally `{icon, children, disabled}`, where `children` is a list of the same shape. `expanded` (the values of the open branches)
      and `selected` (the value of the chosen row) are two-way. Rows are 56 pixels tall, or 40 with `compact`.

      A row is indented 16 pixels plus 24 for each level, has a 24 pixel chevron that turns a quarter when its branch opens (a leaf keeps the room), an optional icon and a `body_large`
      label; the chosen row is `secondary_container`. A press chooses a row and opens or closes a branch. One Tab stop; the up and down arrows move through the rows that show, Right
      opens a branch and Left closes it, and typing the start of a label jumps to a row. A screen reader hears a tree whose items have their level, and a branch says whether it is
      expanded. `TreeNode` can be used alone for a custom tree. Not built: loading children when a branch first opens, selecting several, dragging to reorder, a context menu, and
      building only the rows in view for a very large tree.
    usage_view: |
      name: files
      widget: Container
      style: {width: 360, height: 420}
      children:
        - widget: Tree
          expanded: "{{ open }}"
          selected: "{{ current }}"
          nodes:
            - value: docs
              label: Documents
              icon: folder
              children:
                - {value: a, label: Letter}
                - {value: b, label: Reports, children: [{value: q, label: Q1}]}
            - {value: readme, label: Readme, icon: file}
    python: |
      from tesserae.widgets import tree_node

      folder = tree_node(app.window, "src", depth=0, expanded=True)
      file = tree_node(app.window, "app.py", depth=1, leaf=True)

  # -- Navigation --------------------------------------------------------------------------------
  - slug: navigation-rail
    title: Navigation rail
    group: Navigation
    views: [NavigationRail, NavigationRailItem, NavigationRailScreens, NavigationRailScreen]
    md3: |
      A navigation rail puts three to seven destinations in a narrow column beside the content, on medium and
      large windows. Each is an icon in a pill with a label; the selected one's pill is filled.
    built: |
      Four views Tesserae ships: `NavigationRail` (the column), `NavigationRailItem` (one destination), `NavigationRailScreens` (a rail whose destinations are the
      app's screens) and `NavigationRailScreen` (one such destination).

      The `items` of a `NavigationRail` are `{value, label, icon}` and optionally `{badge, disabled}` (`badge: true` is a dot), and `selected` is the value of the chosen one: a press, or an
      arrow key, writes it back. Those of a `NavigationRailScreens` are `{screen, label, icon}` and optionally `{badge}`. The rail is 80 pixels wide with the labels under the icons, or 220
      with `expanded: true` and the labels beside them; `alignment` puts the destinations at the `top` (the default), `center` or `bottom` of the column, and `frosted: true` makes the
      surface translucent and blurred.

      A destination is a 24 pixel icon in a 56 by 32 pill (`secondary_container` when it is the chosen one) over a `label_medium` label, 12 pixels from the
      next, starting 44 pixels down. Children with `slot: header` (a menu button, a FAB) go above the destinations and `slot: footer` below. There is one Tab stop;
      the up and down arrows move the focus and choose the destination. A screen reader hears a link named by the label, the current one marked as the page.
      The screens rail follows `app.current_screen` and a press is `navigate_to(screen)`; it belongs in each screen (or in a window's shell). Not built: the
      modal expanded rail, sections with headings, the pill growing as it is selected (it fades in), and a `navigation` role for the rail (tre has none, so it is a `group` named Navigation).
    usage_view: |
      name: shell
      widget: Container
      style: {flex_direction: horizontal, width: 480, height: 400}
      children:
        - widget: NavigationRail
          selected: "{{ page }}"
          items:
            - {value: home, label: Home, icon: home}
            - {value: search, label: Search, icon: search, badge: 3}
        - widget: NavigationRailScreens
          items:
            - {screen: Main, label: Tasks, icon: home}
            - {screen: Settings, label: Settings, icon: settings}
    python: |
      from tesserae.widgets import navigation_rail

      rail = navigation_rail(app.window, ["Home", "Search"], ["home", "search"], selected=0)
    see: [guide/windows-and-docks.md, guide/effects.md]

  - slug: navigation-drawer
    title: Navigation drawer
    group: Navigation
    views: [NavigationDrawer, NavigationDrawerItem, NavigationDrawerModal, NavigationDrawerPanel, NavigationDrawerScreens]
    md3: |
      A navigation drawer holds more destinations than a rail, as a vertical list of icon-and-label items. It can
      be permanent (standard) or slide over the content (modal).
    built: |
      Views Tesserae ships: `NavigationDrawer` (standard, beside the content), `NavigationDrawerModal` (over a scrim), `NavigationDrawerScreens` (the app's screens), and
      `NavigationDrawerItem` (one destination) and `NavigationDrawerPanel` (the inside the first two share).

      The `items` are rows: `{value, label, icon}` and optionally `{badge, disabled}`, `{heading: Text}` for a section's title, and `{divider: true}` for a line (for
      `NavigationDrawerScreens`, `{screen, label, icon}` in place of `value`). `selected` is the chosen destination, and a press or an arrow key writes it back. `open` is two-way: on a
      standard drawer it says whether the drawer takes its room (the width eases, which is how it collapses), on a modal one whether it is showing. The drawer is `width` wide, held between
      256 and 360 pixels (360 by default). `frosted: true` makes the surface translucent and blurred.

      A destination is a 56 pixel pill with 28 pixel corners, a 24 pixel icon, a `label_large` label and a badge at the end; the chosen one is `secondary_container`.
      Children with `slot: header` and `slot: footer` go above and below the destinations, which scroll when there are too many. A modal drawer is
      `surface_container_low` at level 1 with 16 pixel corners on the right; a press on a destination closes it, as do Escape and a press on the scrim. A screen reader hears
      a link per destination, the current one marked as the page. Not built: the modal drawer sliding in (an overlay is where its style says when first drawn), and a
      standard drawer that becomes a rail by itself when the window narrows.
    usage_view: |
      name: shell
      widget: Container
      style: {flex_direction: horizontal, width: 720, height: 480}
      children:
        - widget: NavigationDrawer
          selected: "{{ page }}"
          items:
            - {value: inbox, label: Inbox, icon: home, badge: 24}
            - {value: sent, label: Sent, icon: send}
            - {divider: true}
            - {heading: Labels}
            - {value: work, label: Work, icon: tag}
        - widget: NavigationDrawerScreens
          items: [{screen: Main, label: Tasks, icon: home}, {screen: Settings, label: Settings, icon: cog}]
    python: |
      from tesserae.widgets import navigation_drawer

      drawer = navigation_drawer(app.window, ["Inbox", "Search"], ["home", "search"], selected=0)
    see: [guide/overlays.md, guide/effects.md]

  - slug: top-app-bar
    title: Top app bar
    group: Navigation
    views: [TopAppBar]
    md3: |
      A top app bar sits along the top of a screen with its title and the actions for it: a navigation icon at the
      start and up to a few action icons at the end.
    built: |
      `widget: TopAppBar` is a view Tesserae ships (`TopAppBar_View.yaml`): a bar as wide as its place, built from `IconButton`s and a title.

      The `variant` is `small` (64 tall, the title beside the icon, the default), `center` (64, the title in the middle), `medium` (112) or `large` (152), the last two with the title under
      the icons. `leading_icon` is the navigation icon (`menu` or `arrow_back`), `leading_label` its name and tooltip, and `on_leading` what it does. `actions` are up to three icons at the
      end, each `{value, icon, label}`; pressing one sets `chosen` to its `value`. `collapsed` makes a medium or large bar show as a small one (the height eases), and `scrolled` says content
      is under the bar: its colour goes from `surface` to `surface_container`. `frosted: true` makes the surface translucent and blurred.

      Bind `collapsed` and `scrolled` to how a list under the bar has scrolled (the `at_top` of a `ScrollView`). Every icon is a button with a label, which is its name and its
      tooltip. With `App(borderless=True)` a bar can sit in a window's title area; the title bar of a window is `TitleBar`. Not built: the contextual action mode (a selection bar
      that replaces it), and a search bar inside it (`SearchBar` is its own view).
    usage_view: |
      name: inbox
      widget: Container
      style: {flex_direction: vertical, width: 480, height: 400}
      children:
        - widget: TopAppBar
          title: Inbox
          variant: large
          leading_icon: menu
          on_leading: open_drawer
          collapsed: "{{ not at_top }}"
          scrolled: "{{ not at_top }}"
          chosen: "{{ command }}"
          actions: [{value: search, icon: magnify, label: Search}, {value: more, icon: dots_vertical, label: More}]
        - {widget: ScrollView, at_top: "{{ at_top }}", style: {flex: fill}}
    python: |
      from tesserae.widgets import top_app_bar

      bar = top_app_bar(app.window, "Notes", leading_icon="menu", trailing_icons=["settings"])
    see: [guide/custom-title-bars.md, guide/windows-and-docks.md, guide/effects.md]

  - slug: tabs
    title: Tabs
    group: Navigation
    views: [Tabs]
    md3: |
      Tabs organise content at one level of hierarchy, with the selected tab marked by an indicator. Primary tabs
      may carry an icon above the label.
    built: |
      `widget: Tabs` is a view Tesserae ships (`Tabs_View.yaml`): a row of equal tabs over a divider, with an indicator under the chosen tab that
      slides to the next one.

      The `tabs` are `{value, label}` and optionally `{icon, badge}`; an expression follows its Signals. `selected` is the value of the chosen tab, and a press or an arrow key writes it
      back. With `variant: primary` (the default) the indicator is 3 pixels tall, rounded on top, and 12 pixels in from each side of the tab; with `secondary` it is 2 pixels tall across
      the whole tab. Every tab is `tab_width` wide (120 by default).

      The bar is 48 pixels tall, or 64 when a primary bar has an icon. The chosen tab's label and icon are `primary`, the others `on_surface_variant`. The bar
      is a `tablist` with one Tab stop; the arrow keys, Home and End move the focus and choose the tab. The panel each tab shows is yours: put an
      `if: "selected == 'trips'"` on it. Not built: a bar that scrolls when the tabs do not fit.
    usage_view: |
      name: trips
      widget: Container
      style: {flex_direction: vertical, width: 360, height: 160}
      children:
        - widget: Tabs
          selected: "{{ tab }}"
          tabs:
            - {value: flights, label: Flights, icon: home}
            - {value: trips, label: Trips, icon: search, badge: 3}
            - {value: explore, label: Explore, icon: menu}
    python: |
      from tesserae.widgets import tabs

      bar = tabs(app.window, ["Videos", "Photos"], selected=0)

  - slug: menus
    title: Menus
    group: Navigation
    views: [Menu, MenuItem]
    md3: |
      A menu shows a list of choices on a temporary surface, opened by a button, a right click or a keyboard
      shortcut.
    built: |
      Two views Tesserae ships: `Menu`, an anchored `Overlay` holding the rows, and `MenuItem`, one 48 pixel row.

      A `Menu` is shown while `open` is true; Escape and a press outside write `false` back. `anchor` is the name of the node in the calling view it sits against, and `placement`
      (`below` by default, `above`, `start` or `end`) the side, which it flips or shifts to fit. The `items` are rows `{value, label}` and optionally `{icon, shortcut, checked, disabled,
      submenu}`, `{divider: true}` for a line and `{heading: Text}` for a small heading. Pressing an item writes its `value` to `chosen`, closes the menu and calls `on_pick`. With `mode:
      check` pressing an item flips its check (the checked values are `checks`); with `mode: radio` one item is checked (`selected`). The menu is `width` wide, 112 to 280 pixels (200 by
      default), and `frosted: true` makes the surface translucent and blurred.

      A `MenuItem` has a `label`, an `icon`, `trailing_text` (a shortcut), `checked` (true shows a check, false keeps the room, empty is not checkable), `submenu` (a chevron) and
      `disabled`. An item with a `submenu` list opens another `Menu` beside it, on a press or the Right arrow, and choosing in it closes both. The arrows move between rows,
      Enter chooses, typing the start of a label jumps to it. A long press can open it (`handlers: {on_long_press: ...}` on the node, writing `open`), and in Python `attach_context(node)`
      on a `menu(...)` opens it at the pointer on a right-click. Not built: a right-click opener in a view, and the exposed dropdown under a text field.
    usage_view: |
      name: editor
      widget: Container
      style: {width: 480, height: 360}
      children:
        - {widget: Button, name: more, label: More, handlers: {on_click: "open = True"}}
        - widget: Menu
          open: "{{ open }}"
          anchor: more
          chosen: "{{ command }}"
          items:
            - {value: cut, label: Cut, shortcut: Ctrl+X}
            - {value: copy, label: Copy, icon: content_copy}
            - {divider: true}
            - {value: share, label: Share, submenu: [{value: mail, label: Mail}, {value: link, label: Link}]}
    python: |
      from tesserae.widgets import menu

      actions = menu(app.window, [("Cut", viewmodel.cut), ("Copy", viewmodel.copy)], width=200)
      actions.open(save.node)
    see: [guide/overlays.md, guide/effects.md]

  - slug: search
    title: Search
    group: Navigation
    views: [SearchBar, SearchView]
    md3: |
      A search bar is a rounded field that starts a search; the search view is the full-size surface that shows
      suggestions and results once it is focused.
    built: |
      Two views Tesserae ships. `widget: SearchBar` is a 56 pixel `surface_container_high` pill at level 3 with a leading icon, the text, and trailing parts. `widget: SearchView`
      is the docked panel that opens under it with the suggestions, history and results.

      `query` is what has been typed. `active` says the search is under way: pressing the bar or typing in it sets it, and the back arrow clears it. The bar has a `placeholder`, a
      `leading_icon` (a search glass; `menu` makes it a menu button that runs `on_leading`), an optional `trailing_icon` (a microphone, say, that runs `on_trailing` and shows
      while the field is empty) and an optional avatar (`avatar_text`); Enter calls `on_search`. The `results` of a `SearchView` are `{value, label}` rows, optionally with `supporting` and
      `icon`; the row pressed goes to `chosen`, `open` says whether the view shows, and `anchor` names the bar it sits under. `frosted: true` makes the bar and the view translucent
      and blurred.

      A clear button shows once there is text. While active the leading icon is a back arrow. Bind the bar's `active` and the view's `open` to the same name, and the view's `results` to
      something that follows `query`. The view says how many results there are, politely, and `empty` text when a query finds none. Escape and a press outside close it. Not built:
      the full-screen search view for small windows, and a keyboard shortcut that focuses the bar.
    usage_view: |
      name: notes
      widget: Container
      style: {flex_direction: vertical, width: 420, height: 420, padding: 16}
      children:
        - {widget: SearchBar, name: bar, query: "{{ q }}", active: "{{ searching }}", placeholder: Search notes, style: {width: 360}}
        - widget: SearchView
          anchor: bar
          open: "{{ searching }}"
          query: "{{ q }}"
          results: "{{ matches }}"
          chosen: "{{ picked }}"
    python: |
      from tesserae.widgets import search_bar

      search = search_bar(app.window, "Search notes", 360)
    see: [guide/effects.md]

  - slug: toolbars
    title: Toolbars
    group: Navigation
    views: [Toolbar]
    md3: |
      A toolbar groups the actions for the content around it. A **docked** one is fixed to an edge; a **floating**
      one is a rounded bar over the content.
    built: |
      `widget: Toolbar` is a view Tesserae ships (`Toolbar_View.yaml`): one widget for the docked and the floating toolbar, built from `IconButton`s, an optional `Fab` and a `Menu`.

      A `docked` toolbar spans its width (or `width`), 64 tall, on `surface_container`; a `floating` one is a pill with a shadow as long as its buttons, and with `orientation: vertical` a
      column 64 wide. `vibrant: true` puts it on `primary_container`, with `on_primary_container` icons. The `items` are icon buttons, each `{value, icon, label}` and optionally `disabled`;
      the `value` of the item or overflow row pressed goes to `chosen`. `overflow` is `Menu` rows under a more button at the end. `fab_icon` (with `fab_label` and `on_fab`) adds a small
      action button at the end. With `fit`, items that do not fit move, in order, into the overflow menu; a docked toolbar measures itself, a floating one uses `max_length` pixels.
      `hidden` fades it out and takes its buttons out of the tab order (bind it to the way a list scrolls). `label` is its accessible name, and `disabled` stops every button.

      Your own content goes in the default slot after the items. The arrow keys move between the buttons (one Tab stop). The role is `group`: the engine has no toolbar role.
      With `fit`, the items that spill and the rows of `overflow` share one menu, a divider between. Not built: sliding out of the way (it fades).
    usage_view: |
      name: editor
      widget: Container
      style: {width: 420, height: 200, padding: 16, flex_direction: vertical, gap: 16}
      children:
        - widget: Toolbar
          name: tools
          items:
            - {value: bold, icon: format_bold, label: Bold}
            - {value: italic, icon: format_italic, label: Italic}
            - {value: link, icon: link, label: Link}
          overflow:
            - {value: copy, label: Copy}
            - {value: share, label: Share}
          fab_icon: plus
          fab_label: Add
          chosen: "{{ last }}"
        - widget: Toolbar
          variant: floating
          vibrant: true
          items:
            - {value: search, icon: search, label: Search}
            - {value: star, icon: star, label: Star}
        - {widget: Text, text: "{{ last }}", typography_role: body_medium, style: {foreground: on_surface}}
    python: |
      from tesserae.widgets import toolbar

      tools = toolbar(app.window, variant="floating", width=240)

  - slug: links
    title: Links
    group: Navigation
    widgets: [Link]
    md3: |
      A link takes the user somewhere else, or opens a related page. It is text, in the primary colour.
    built: |
      `widget: Link` is text that takes focus, and that Enter or a click activates. It is `primary`, in `body_medium` unless you name another type role.

      The `text` also names the link for a screen reader. Its `href` is opened in the OS's browser or mail program when the link is activated: `http`, `https`, `mailto` and `tel` only,
      anything else is refused. Opening it sets a bound `visited`, and `state: visited` in a rule colours it (`secondary` by default). A disabled link is dimmed, out of the Tab order,
      and does nothing. It is underlined while the pointer is over it or keyboard focus is on it (`underline: hover`, the default), always, or never. `handlers: {on_click: ...}` runs
      as well as the `href` opens; a link with no `href` just runs its handler.

      The type properties of `Text` (`typography_role`, `wrap`, `overflow`, `max_lines`, ...) apply. A link inside a longer text is a `link` run of a `Text` (`runs`, [Rich Text & Links](../guide/rich-text.md)); a `Link` is for a whole line.
    usage_view: |
      name: help
      widget: Container
      style: {flex_direction: vertical, gap: 8, width: 300, height: 100}
      children:
        - {widget: Link, text: Read the docs, href: "https://example.com/docs", visited: "{{ docs_seen }}"}
        - {widget: Link, text: Not now, disabled: true}
        - {widget: Link, text: Sign in, handlers: {on_click: sign_in}}
    python: |
      from tesserae.widgets import link

      help_link = link(app.window, "Read the docs", 160, on_click=viewmodel.open_docs)
    see: [guide/rich-text.md]

  # -- Selection and input -----------------------------------------------------------------------
  - slug: checkboxes
    title: Checkbox
    group: Selection and input
    widgets: [Checkbox]
    md3: |
      A checkbox lets the user select one or more items from a set, or turn an option on or off. It has a 40dp
      state layer around an 18dp box.
    built: |
      `widget: Checkbox` is one of Tesserae's controls (`tesserae.controls.Checkbox`). Give `checked` a bare reference and a press writes it back. It has three
      states: on, off, and empty (`null`), which is neither: a dash in a filled box, for a parent of some checked children. A press turns an empty one on.

      The `label` sits beside the box and is part of what you press: pressing the text toggles the box and gives it the focus. `error` draws it in the error colours, and a
      disabled one is dimmed and does nothing. `handlers: {on_change: ...}` runs after the user changes it (not when the bound value changes).

      The colour is `style.foreground`. The 18 pixel box sits in a 48 pixel target with a 40 pixel state layer; Tab reaches it, and Space or Enter toggles it.
    usage_view: |
      name: terms
      widget: Container
      style: {flex_direction: vertical, gap: 4, width: 280, height: 160, padding: 16}
      children:
        - {widget: Checkbox, checked: "{{ all_read }}", label: I have read the terms, error: "{{ show_error }}"}
        - {widget: Checkbox, checked: "{{ some_read }}", label: Select all}      # empty while only some are on
    python: |
      from tesserae.widgets import checkbox

      agree = checkbox(app.window, (0xFF, 0xFF, 0xFF, 0xFF), 48, 48, checked=False)
      agree.checked.get()
    see: [guide/controls.md]

  - slug: radio-buttons
    title: Radio button
    group: Selection and input
    widgets: [RadioButton]
    md3: |
      A radio button lets the user choose one option from a set. Radio buttons in one group exclude each other,
      and the arrow keys move between them.
    built: |
      `widget: RadioButton`, a Tesserae control: a 20 pixel ring with a dot that grows in when it is chosen. Radio buttons with one `group:` name share a group: choosing
      one unchooses the others, the group is one Tab stop (the chosen one, else the first that is not disabled), and the arrow keys move the choice (and the focus) to the next or
      previous button that is not disabled, wrapping round. A press on a chosen one does not unchoose it. The `label` sits beside the ring and is part of what you press.

      To keep the choice in one value, test it in `selected` and set it in `on_change`: `selected: "{{ size == 'm' }}"`, `on_change: "size = 'm'"`.
    usage_view: |
      name: sizes
      widget: Container
      style: {flex_direction: vertical, gap: 4, width: 240, height: 180, padding: 16}
      children:
        - {widget: RadioButton, group: size, label: Small, selected: "{{ size == 's' }}", handlers: {on_change: "size = 's'"}}
        - {widget: RadioButton, group: size, label: Medium, selected: "{{ size == 'm' }}", handlers: {on_change: "size = 'm'"}}
        - {widget: RadioButton, group: size, label: Large, selected: "{{ size == 'l' }}", handlers: {on_change: "size = 'l'"}}
    python: |
      from tesserae.controls import RadioGroup
      from tesserae.widgets import radio_button

      group = RadioGroup()
      small = radio_button(app.window, 48, selected=True, group=group)
    see: [guide/controls.md]

