  # -- Content -----------------------------------------------------------------------------------
  - slug: text
    title: Text
    group: Content
    fragments: [Text]
    md3: |
      Text is set in Material Design 3's type scale: 15 styles in five groups (display, headline, title, body and
      label), each large, medium or small, with a font, size, weight and line height.
    built: |
      The `Text` kind. Name a `typography_role` and Tesserae fills in the rest; a theme's `typography:` can change
      what a role means.
    usage: |
      - id: heading
        component: Text
        with: {text: Notes, typography_role: headline_medium, color: on_surface}
    python: |
      from tesserae.widgets import text

      heading = text(app.window, "Notes", typography_role="headline_medium")
    see: [themes/index.md]

  - slug: images
    title: Images
    group: Content
    fragments: [Image]
    md3: |
      An image shows a picture, fitted to its box. Material Design 3 describes how to crop and round it in a
      container.
    built: |
      The `Image` kind: Tesserae reads and decodes the file, and `fit` says how it fills the box.
    usage: |
      - id: photo
        component: Image
        with: {src: cat.png, width: 200, height: 150, fit: cover}
    python: |
      from tesserae.widgets import image

      photo = image(app.window, "cat.png", 200, 150, fit="cover")

  - slug: svg
    title: SVG
    group: Content
    node_kind: Svg
    fragments: []
    md3: |
      Material Design 3 uses SVG for its icons and illustrations. An SVG document is vector art: shapes, gradients,
      patterns, clips, masks and text, which scale to any size without blurring.
    built: |
      The `Svg` node kind: the engine parses and draws the whole document as one scene, scaled to fit the node's box and
      centred in it. Tesserae reads the file, and decodes the raster pictures in it (`<image href="...">`: PNG, JPEG, GIF
      or WebP, found next to the SVG file, or a `data:` URL) for the engine, which decodes no image format. `src:` is a
      `.svg` or `.svgz` file next to the view, or `content:` is the document itself. `style.foreground` is what
      `currentColor` means in the document, so a monochrome icon follows the theme, light and dark. Give a `width` or a
      `height`, or both. Hot reload watches the file and the pictures in it.
    usage: |
      - id: logo
        kind: Svg
        svg:
          content: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"><circle cx="12" cy="12" r="10" fill="currentColor"/></svg>'
        style: {width: 48, height: 48, foreground: primary}
    python: |
      from tesserae.widgets import svg

      logo = svg(app.window, '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"><circle cx="12" cy="12" r="10" fill="currentColor"/></svg>',
                 width=48, height=48, color="primary", label="A dot")

  - slug: video
    title: Video
    group: Content
    fragments: [Video]
    md3: |
      Video is content, not a component, in Material Design 3; Tesserae shows frames you supply.
    built: |
      An `Image` node whose frame is pushed to it, from a binding.
    usage: |
      - id: clip
        component: Video
        with: {width: 320, height: 180, fit: contain}
    python: |
      from tesserae.widgets import video

      clip = video(app.window, 320, 180, fit="contain")

  - slug: carousel
    title: Carousel
    group: Content
    fragments: []
    md3: |
      A carousel shows a row of items that scroll, with the focused one largest. MD3 has multi-browse, uncontained,
      hero and full-screen layouts.
    built: |
      Python only.
    python: |
      from tesserae.widgets import carousel

      gallery = carousel(app.window, 480, 180, layout="multi_browse", items=[])

  - slug: pagination
    title: Pagination
    group: Content
    fragments: []
    md3: |
      Pagination shows where the user is among pages: a row of dots or numbers.
    built: |
      Python only.
    python: |
      from tesserae.widgets import pagination

      pages = pagination(app.window, 10, current=0)

  # -- Beyond MD3 --------------------------------------------------------------------------------
  - slug: status-bar
    title: Status bar
    group: Beyond MD3
    fragments: [StatusBar]
    md3: |
      Material Design 3 has no status bar. A desktop app often wants one, so this is a thin strip in MD3's
      surface and *label* style.
    built: |
      A container with one `Text`. It keeps its height when the window is short, and takes a `style`.
    usage: |
      - id: status
        component: StatusBar
        with: {text: Ready, width: 640}
    python: |
      from tesserae.widgets import status_bar

      status = status_bar(app.window, "Ready", style={"height": 32})
    see: [guide/app-shell.md]

  - slug: node-graph
    title: Node graph
    group: Beyond MD3
    fragments: [NodeGraph]
    md3: |
      Material Design 3 has no node graph. This is a pannable canvas of titled boxes joined by edges, for tools.
    built: |
      The `NodeGraph` kind, with `GraphNode` children.
    usage: |
      - id: graph
        component: NodeGraph
        with: {width: 480, height: 320}
    python: |
      from tesserae.widgets import graph_node, node_graph

      graph = node_graph(app.window, 480, 320)
      source = graph_node(app.window, graph, "Source", 40, 40, 120, 60)

  - slug: splitter
    title: Splitter
    group: Beyond MD3
    fragments: []
    md3: |
      Material Design 3 has no splitter. It divides the window into two panes with a bar the user drags.
    built: |
      Python only.
    python: |
      from tesserae.widgets import splitter

      panes = splitter(app.window, left.node, right.node, 640, 400, orientation="horizontal", position=0.3)
