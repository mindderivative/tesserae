  - slug: checkboxes
    title: Checkbox
    group: Selection and input
    widget: Checkbox
    fragments: [Checkbox]
    md3: |
      A checkbox lets the user select one or more items from a set, or turn an option on or off. It has a 40dp
      state layer around an 18dp box.
    built: |
      `widget: Checkbox` is one of Tesserae's controls (`tesserae.controls.Checkbox`). Give `checked` a bare reference and a press writes it back.

      | Property | Type | Meaning |
      | --- | --- | --- |
      | `checked` | true, false or empty, two-way | empty (`null`) is neither on nor off: a dash in a filled box, for a parent of some checked children; a press turns it on |
      | `label` | text | beside the box, part of what you press, and what a screen reader calls it |
      | `error` | true or false | drawn in the error colours |
      | `disabled` | true or false | dimmed and does nothing |

      The colour is `style.foreground`. The 18 pixel box sits in a 48 pixel target with a 40 pixel state layer; Space toggles it from the keyboard.
    usage_view: |
      name: terms
      widget: Container
      style: {flex_direction: vertical, gap: 4, width: 280, height: 160, padding: 16}
      children:
        - {widget: Checkbox, checked: "{{ all_read }}", label: I have read the terms, error: "{{ show_error }}"}
        - {widget: Checkbox, checked: "{{ some_read }}", label: Select all}      # empty while only some are on
    usage: |
      - id: agree
        component: Checkbox
        with: {background: surface, width: 48, height: 48, checked: false}
        handlers: {on_change: toggled}
    python: |
      from tesserae.widgets import checkbox

      agree = checkbox(app.window, (0xFF, 0xFF, 0xFF, 0xFF), 48, 48, checked=False)
      agree.checked.get()
    see: [guide/controls.md]

  - slug: radio-buttons
    title: Radio button
    group: Selection and input
    widget: RadioButton
    fragments: [RadioButton]
    md3: |
      A radio button lets the user choose one option from a set. Radio buttons in one group exclude each other,
      and the arrow keys move between them.
    built: |
      `widget: RadioButton`, a Tesserae control. Radio buttons with one `group:` name share a group: choosing one unchooses the others, the group is one
      Tab stop (the chosen one, else the first), and the arrow keys move the choice.

      | Property | Type | Meaning |
      | --- | --- | --- |
      | `selected` | true or false, two-way | whether it is the chosen one |
      | `group` | a name | buttons with the same name exclude each other |
      | `label` | text | beside the ring, part of what you press, and what a screen reader calls it |
      | `error` | true or false | drawn in the error colours |
      | `disabled` | true or false | dimmed and does nothing |

      To keep the choice in one value, test it in `selected` and set it in `on_change`: `selected: "{{ size == 'm' }}"`, `on_change: "size = 'm'"`.
    usage_view: |
      name: sizes
      widget: Container
      style: {flex_direction: vertical, gap: 4, width: 240, height: 180, padding: 16}
      children:
        - {widget: RadioButton, group: size, label: Small, selected: "{{ size == 's' }}", handlers: {on_change: "size = 's'"}}
        - {widget: RadioButton, group: size, label: Medium, selected: "{{ size == 'm' }}", handlers: {on_change: "size = 'm'"}}
        - {widget: RadioButton, group: size, label: Large, selected: "{{ size == 'l' }}", handlers: {on_change: "size = 'l'"}}
