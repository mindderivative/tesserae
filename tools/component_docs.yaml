  - slug: sliders
    title: Slider
    group: Selection and input
    widget: Slider
    fragments: [Slider]
    md3: |
      A slider lets the user pick a value from a range by dragging a handle, or with the keyboard.
    built: |
      `widget: Slider`, a Tesserae control: a 4 pixel track, a 20 pixel handle and a 40 pixel state layer in a 48 pixel target.

      | Property | Type | Meaning |
      | --- | --- | --- |
      | `value` | number, two-way | from `min` to `max`; a bound Signal follows the drag, not only its end |
      | `min`, `max` | numbers | the range; 0 to 1 by default |
      | `step` | number | snap to multiples of it from `min`; the keys move by it (else by a hundredth of the range) |
      | `ticks` | true or false | a mark at each step (needs `step`): a discrete slider |
      | `value_indicator` | true or false | a bubble with the value over the handle while it is dragged or has the keyboard |
      | `label` | text | what a screen reader calls it |
      | `disabled` | true or false | dimmed and does not move |

      Events: `on_input` while it is dragged (every step), `on_change` once it is let go and after each key. Dragging captures the pointer; the arrow keys
      step it, Page Up and Down move by ten steps, Home and End go to the ends, and a screen reader can increment, decrement and set it. The colour is
      `style.foreground` and the length is `style.width`. Range (two handles), vertical and inset icons are not built.
    usage_view: |
      name: player
      widget: Container
      style: {flex_direction: vertical, gap: 16, width: 280, height: 160, padding: 16}
      children:
        - {widget: Slider, value: "{{ volume }}", min: 0, max: 100, label: Volume, value_indicator: true, style: {width: 240}}
        - {widget: Slider, value: "{{ stars }}", min: 1, max: 5, step: 1, ticks: true, style: {width: 240}}
    usage: |
      - id: volume
        component: Slider
        with: {background: surface, width: 240, height: 44, value: 0.5}
    python: |
      from tesserae.widgets import slider

      volume = slider(app.window, (0xFF, 0xFF, 0xFF, 0xFF), 240, 44, value=0.5)
      volume.on_change(print)
    see: [guide/controls.md]

  - slug: chips
    title: Chips
    group: Selection and input
    shipped_view: Chip
    fragments: [ChipAssist, ChipFilter, ChipFilterSelected, ChipInput, ChipSuggestion]
    md3: |
      Chips are compact elements for an action, a filter, a piece of input, or a suggestion. **Assist** chips
      start an action, **filter** chips narrow results (and show a check when selected), **input** chips are
      things the user entered, and **suggestion** chips offer a reply or next step.
    built: |
      `widget: Chip` is a view Tesserae ships (`Chip_View.yaml`): 32 pixels tall with 8 pixel corners, as wide as its label. `widget: ChipGroup` is a wrapping row of
      them.

      | Property | Type | Meaning |
      | --- | --- | --- |
      | `label` | text | the text |
      | `variant` | `assist`, `filter`, `input`, `suggestion` | what it is for (default `assist`) |
      | `icon`, `avatar_text` | an icon, letters | a leading 18 pixel icon, or letters in a 24 pixel circle |
      | `selected` | true or false; two-way | a filter or input chip that is on: `secondary_container`, no outline, a check in place of the icon |
      | `elevated` | true or false | a raised surface instead of an outline |
      | `removable`, `removed`, `on_remove` | true or false; true or false, two-way; a handler | a close button; pressing it sets `removed` and runs `on_remove` |
      | `disabled` | true or false | dimmed, not focusable, handlers do not respond |

      A filter chip flips `selected` itself (`flip: false` leaves that to you); `handlers: {on_click: ...}` on the call is what a press does. A `ChipGroup` takes
      `chips` (`{value, label}` and optionally `{icon, avatar_text, disabled}`) and a `mode`: `none` (assist or suggestion chips; the last pressed goes to
      `chosen`), `single` or `multiple` (filter chips; `selected` is the value or the list of values), or `input` (chips with a close, and a field: Enter adds a
      chip, the close removes one, and `chips` is two-way). Not built: dragging chips to reorder, and a chip group that scrolls sideways.
    usage_view: |
      name: filters
      widget: Container
      style: {flex_direction: vertical, gap: 16, width: 420, height: 240}
      children:
        - {widget: Chip, label: Share, icon: home, handlers: {on_click: share}}
        - widget: ChipGroup
          mode: multiple
          selected: "{{ filters }}"
          chips: [{value: open, label: Open}, {value: mine, label: Mine}, {value: late, label: Overdue}]
        - {widget: ChipGroup, mode: input, chips: "{{ tags }}", entry: "{{ typed }}"}
    python: |
      from tesserae.widgets import chip

      shipped = chip(app.window, "Shipped", 96, variant="filter", selected=True)

  - slug: text-fields
    title: Text fields
    group: Selection and input
    shipped_view: TextField
    fragments: []
    md3: |
      A text field lets people enter and edit text. Material Design 3 has two kinds: a **filled** field, a tinted container with a line under
      it, and an **outlined** one, a field with a border. The label is the field's name: it sits in the middle as a hint and moves up, smaller,
      when the field has focus or text. Supporting text, a character counter, icons before and after, and an error state with its message
      belong to the field.
    built: |
      `widget: TextField` is a view Tesserae ships (`TextField_View.yaml`) with its look as rules (`TextField_Stylesheet.yaml`). It is built from
      the `TextInput` widget, the bare input, and the nodes around it, so every part has a name a stylesheet can address.

      | Property | Type | Meaning |
      | --- | --- | --- |
      | `variant` | `filled` or `outlined` | the look; `filled` by default |
      | `label` | text | the field's name; it also names the input for a screen reader |
      | `text` | text, two-way | what is typed: give it a bare reference and typing writes it |
      | `placeholder` | text | shown while the field is empty and has focus (or has no label) |
      | `supporting` | text | help under the field |
      | `error` | text | an error message: the field takes the error look and the message replaces the supporting text |
      | `leading`, `trailing` | icon name | an icon before and after the text; an error replaces the trailing icon |
      | `prefix`, `suffix` | text | text around the typing, such as `$` and `USD` |
      | `max_length` | whole number | the most characters it takes; `0` is no limit |
      | `counter` | true or false | shows how many characters are typed, of `max_length` when there is one |
      | `multiline` | true or false | several lines; Enter makes a new one |
      | `obscured` | true or false | a password: dots, with a button that shows the text |
      | `disabled`, `read_only` | true or false | dimmed and takes no typing; the text can be selected and copied but not changed |

      Events: `on_change` when the text changes, `on_key` for each key pressed in the field, and `on_submit` for Enter in a field that is not
      multiline. A handler written on the field is called as the user types.

      The parts a stylesheet can address are `box`, `label`, `input`, `prefix`, `suffix`, `leading_icon`, `trailing_icon`, `error_icon`,
      `reveal_button`, `reveal_icon`, `indicator` (the line under a filled field), `supporting` and `counter`. The state of a rule is the state of
      the whole field: `focused` is true while anything inside it has the focus, `hovered` while the pointer is over it, and `error` and
      `disabled` read the field's own properties. The label jumps between its two places; moving it smoothly needs `transition:`, which the
      language reserves.
    usage_view: |
      name: signup
      widget: Container
      style: {flex_direction: vertical, width: 360, height: 420, gap: 16, padding: 16}
      children:
        - widget: TextField
          name: email
          label: Email
          leading: search
          text: "{{ email }}"
          error: "{{ email_error }}"
          supporting: We never share it
          handlers: {on_submit: sign_up}
        - widget: TextField
          name: password
          variant: outlined
          label: Password
          obscured: true
          text: "{{ password }}"
        - widget: TextField
          name: bio
          label: About you
          multiline: true
          max_length: 140
          counter: true
          text: "{{ bio }}"
    after: |
      `TextInput` is the bare input, for when the field around it is your own: `text`, `placeholder`, `multiline`, `obscured`, `max_length`,
      `read_only` and `disabled`, drawn as one line that scrolls.

      ## Changing its look

      Write rules for `TextField` in your app's stylesheet; they sit above the shipped ones, and a `style:` on the node beats every rule for the
      fields it sets.

      ```yaml
      styles:
        - widget: TextField
          part: box
          variant: filled
          style: {background: surface_container_high, corner_radius: 12}
        - widget: TextField
          part: indicator
          state: focused
          style: {background: tertiary}
      ```

      A view named `TextField_View.yaml` in your project replaces the shipped field, and its shipped look with it. In a view written with `kind:`,
      `kind: TextField` is the bare input (the `TextInput` widget), with `text: {placeholder, multiline, obscured}` for those three;
      `tesserae migrate-yaml` turns it into `widget: TextInput`.
    see: [guide/view-language.md, guide/bindings.md]

  - slug: spin-boxes
    title: Spin box
    group: Selection and input
    fragments: [SpinBox]
    md3: |
      Material Design 3 has no spin box. Tesserae's is built from MD3's parts: a number field between two 40dp
      icon buttons.
    built: |
      The `SpinBox` kind (`widget: SpinBox` in a view), a Tesserae control. Typing, the arrow keys and the buttons change `value`; `min`, `max` and `step` bound it.

      | Property | Type | Meaning |
      | --- | --- | --- |
      | `value`, `min`, `max`, `step` | numbers; `value` is two-way | the number and what bounds and moves it |
      | `decimals` | a whole number | how many decimal places show |
      | `prefix`, `suffix` | text | shown with the number (a currency sign, a unit); typing may include them or not |
      | `wrap` | true or false | a step past one bound lands on the other, so the buttons never disable (needs `min` and `max`) |
      | `label`, `disabled` | text, true or false | the name for a screen reader; dimmed |

      Holding a button steps again after 400 milliseconds and then every 80, until it is let go or reaches a bound; Page Up and Page Down step ten at a time.
      `widget: SpinBoxField` is a view Tesserae ships that adds a visible `label` above and a line of `supporting` or `error` text under it (`least` and `most` are its
      bounds, `min` and `max` being reserved names). Not built: a hold that speeds up the longer it is held, and a spin box in a vertical arrangement.
    usage_view: |
      name: order
      widget: Container
      style: {flex_direction: vertical, gap: 16, width: 320, height: 240}
      children:
        - {widget: SpinBox, value: "{{ count }}", min: 0, max: 10, label: Count}
        - {widget: SpinBoxField, label: Weight, value: "{{ weight }}", least: 0, most: 50, step: 0.5, decimals: 1, suffix: " kg", supporting: Up to 50}
    python: |
      from tesserae.widgets import spin_box

      quantity = spin_box(app.window, 1, min=0, max=10)
    see: [guide/controls.md]

  - slug: date-pickers
    title: Date picker
    group: Selection and input
    fragments: [DatePickerDay, DatePickerDayToday, DatePickerDaySelected, DatePickerDayOutsideMonth]
    md3: |
      A date picker lets the user pick a date from a month grid. Today is outlined, the chosen day is a filled
      circle, and days of the neighbouring months are dimmed.
    built: |
      The day cell only, in its four states; you lay the grid out (a `display: grid` container is the natural
      fit).
    usage: |
      - id: d7
        component: DatePickerDaySelected
        with: {day: "7"}
    python: |
      from tesserae.widgets import date_picker_day

      day = date_picker_day(app.window, 7, selected=True)

  - slug: time-pickers
    title: Time picker
    group: Selection and input
    shipped_view: TimePicker
    fragments: [TimePickerDial, PeriodSelectorAM, PeriodSelectorPM]
    md3: |
      A time picker lets the user choose an hour and a minute on a dial, with an AM/PM selector in a 12-hour
      format.
    built: |
      Four pieces. `TimePickerDial` is a Tesserae control (`widget: TimePickerDial`): `hour`, `minute` and `mode` (`hour` or `minute`; letting go on an hour moves on to the
      minutes unless `auto_advance` is off). `PeriodSelector` is a view: two halves, `period` `AM` or `PM` (two-way), with an `on_change` handler for after a choice.
      `TimeInput` is a view: an hour field, a colon, a minute field and, in 12-hour time, a period selector, where `hour` and `minute` are two-way and a number that does
      not fit is left out (the fields are filled from the time when they appear). `TimePicker` is the dialog of Material 3.

      | Property of `TimePicker` | Type | Meaning |
      | --- | --- | --- |
      | `open` | true or false; two-way | whether it is showing; Escape and a press on the scrim close it |
      | `hour`, `minute` | whole numbers; two-way | the time, 0 to 23; changed only when OK is pressed |
      | `twelve` | true or false | 12-hour time with a dial and a period selector; off, only the typed fields |
      | `title`, `on_ok` | text, a handler | the small heading; called after OK |

      The picker shows the time as an hour and a minute you press to choose which the dial sets, the period selector, the 256 pixel dial, a keyboard button that
      swaps the dial for the typed fields (and back), and Cancel and OK. Reopening it starts from the time as it then is. Not built: a 24-hour dial with an inner ring,
      limits on the times that can be chosen, and the times as a locale writes them.
    usage_view: |
      name: alarm
      widget: Container
      style: {width: 480, height: 520}
      children:
        - widget: TimePicker
          open: "{{ choosing }}"
          hour: "{{ alarm_hour }}"
          minute: "{{ alarm_minute }}"
          on_ok: alarm_set
        - widget: TimeInput
          hour: "{{ alarm_hour }}"
          minute: "{{ alarm_minute }}"
        - {widget: PeriodSelector, period: "{{ half }}"}
    python: |
      from tesserae.widgets import time_picker_dial

      dial = time_picker_dial(app.window, hour=9, minute=30)
    see: [guide/controls.md]

  - slug: segmented-buttons
    title: Segmented buttons
    group: Selection and input
    shipped_view: SegmentedButton
    fragments: []
    md3: |
      A segmented button is a row of two to five connected options, for one choice or several.
    built: |
      `widget: SegmentedButton` is a view Tesserae ships (`SegmentedButton_View.yaml`): one outlined pill (40 pixels tall, a 1 pixel `outline`, fully
      rounded) of segments with a line between them.

      | Property | Type | Meaning |
      | --- | --- | --- |
      | `options` | a list | the segments, each `{value, label}` and optionally `{icon, disabled}`; an expression follows its Signals |
      | `selected` | a value, or a list with `multiple`; two-way | the chosen one(s); a press writes it back |
      | `multiple` | true or false | several can be chosen; each segment toggles |
      | `disabled` | true or false | dimmed, and no segment can be pressed |

      A chosen segment is `secondary_container` with a check that takes the place of its icon. Single choice is a radio group: one Tab stop (the
      chosen segment), and the arrow keys move the choice; multiple choice is a group of toggles, each its own Tab stop with the arrows moving focus
      only. The look is in the view, because each segment's state is its own: write a `SegmentedButton_View.yaml` in your project to change it.
    usage_view: |
      name: calendar
      widget: Container
      style: {flex_direction: vertical, gap: 16, width: 360, height: 140, padding: 16}
      children:
        - widget: SegmentedButton
          selected: "{{ range }}"
          options:
            - {value: day, label: Day}
            - {value: week, label: Week, icon: home}
            - {value: month, label: Month}
        - widget: SegmentedButton
          multiple: true
          selected: "{{ styles }}"
          options: [{value: bold, label: Bold}, {value: italic, label: Italic}]
    python: |
      from tesserae.widgets import segmented_button

      view = segmented_button(app.window, ["Day", "Week", "Month"], selected=0)
      many = segmented_button(app.window, ["Bold", "Italic"], multi=True, selected=[0])

