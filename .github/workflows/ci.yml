name: CI

# check + test + the examples, on Linux. Since tre 0.3.5.2 the engine is
# on PyPI as `tesserae-engine` (still `import tre`), so installing
# Tesserae installs it as a user's `pip install` would: no tre checkout, no
# Rust toolchain, no maturin build.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tesserae

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # See `tre`'s own ci.yml for the full real reasoning -- lavapipe
      # (Mesa's software Vulkan implementation) is enough for a real
      # `wgpu::Instance::request_adapter` to succeed headlessly.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libfontconfig1-dev

      # tre's source at the release pyproject's floor names, checked out only
      # for a real font file (tests/test_themes.py reads Roboto through
      # TRE_SOURCE_DIR); the wheel ships no .ttf files. Nothing is built from it.
      - uses: actions/checkout@v4
        with:
          repository: mindderivative/tre
          ref: v0.4.0
          path: tre

      # Pulls `tesserae-engine` (tre) from PyPI, per pyproject's `>=` floor.
      - name: Install tesserae (editable, dev extras)
        working-directory: tesserae
        run: pip install -e ".[dev]"

      - name: Run tests
        working-directory: tesserae
        env:
          TRE_SOURCE_DIR: ${{ github.workspace }}/tre
        run: pytest tests/

      - name: Run the counter example
        working-directory: tesserae
        run: python examples/counter/app.py

      - name: Run the multi-screen example
        working-directory: tesserae
        run: python examples/multi_screen/app.py

      - name: Run the todo-list example
        working-directory: tesserae
        run: python examples/todo_list/app.py

      - name: Run the app-shell example
        working-directory: tesserae
        run: python examples/app_shell/app.py

      - name: Run the app-shell file example
        working-directory: tesserae
        run: python examples/app_shell_file/app.py
