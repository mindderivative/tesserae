name: CI

# check + test + the examples, on Linux. Since tre 0.3.5.2 the engine is
# on PyPI as `tesserae-engine` (still `import tre`), so installing
# Tesserae installs it as a user's `pip install` would: no tre checkout, no
# Rust toolchain, no maturin build.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The suite and the examples on each supported platform (M76 Phase 3).
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: tesserae

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # See `tre`'s own ci.yml for the full real reasoning -- lavapipe
      # (Mesa's software Vulkan implementation) is enough for a real
      # `wgpu::Instance::request_adapter` to succeed headlessly.
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libfontconfig1-dev

      # tre's source at the release pyproject's floor names, checked out only
      # for a real font file (tests/test_themes.py reads Roboto through
      # TRE_SOURCE_DIR); the wheel ships no .ttf files. Nothing is built from it.
      - uses: actions/checkout@v4
        with:
          repository: mindderivative/tre
          ref: v0.4.3
          path: tre

      # Pulls `tesserae-engine` (tre) from PyPI, per pyproject's `>=` floor.
      - name: Install tesserae (editable, dev extras)
        working-directory: tesserae
        run: pip install -e ".[dev]"

      # PYTHONUTF8 for the tests' own file reads (Windows defaults to its
      # code page); Tesserae's source says UTF-8 itself (test_source_encoding).
      - name: Run tests
        working-directory: tesserae
        env:
          TRE_SOURCE_DIR: ${{ github.workspace }}/tre
          PYTHONUTF8: "1"
        run: pytest tests/

      - name: Run the counter example
        working-directory: tesserae
        run: python examples/counter/app.py

      - name: Run the multi-screen example
        working-directory: tesserae
        run: python examples/multi_screen/app.py

      - name: Run the todo-list example
        working-directory: tesserae
        run: python examples/todo_list/app.py

      - name: Run the app-shell example
        working-directory: tesserae
        run: python examples/app_shell/app.py

      - name: Run the app-shell file example
        working-directory: tesserae
        run: python examples/app_shell_file/app.py

  # M76: one `pip install` is enough, on every supported platform. Only the
  # built wheel goes into a fresh venv; its dependencies come from PyPI as
  # wheels only (`--only-binary=:all:`), so one that would need compiling
  # fails here rather than on a developer's machine. Then a `tesserae new`
  # app runs headlessly (tools/clean_install_smoke.py: no GPU or display).
  clean-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build --wheel

      - name: Install only the wheel into a fresh venv, wheels only
        shell: bash
        run: |
          python -m venv fresh
          if [ "$RUNNER_OS" = "Windows" ]; then PY=fresh/Scripts/python.exe; else PY=fresh/bin/python; fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          "$PY" -m pip install --only-binary=:all: dist/*.whl
          "$PY" -m pip list

      - name: Make an app with tesserae new and run it
        shell: bash
        run: '"$PY" tools/clean_install_smoke.py'

  # M77: `tesserae build` on every supported platform. The wheel (with its
  # `build` extra) goes into a fresh venv, a `tesserae new --shell` app is
  # built into one executable, and `--check` runs it from an empty folder:
  # it must draw frames and exit cleanly. Linux has no display, so it runs
  # under Xvfb with lavapipe (Mesa's software Vulkan), and needs
  # libxkbcommon-x11, which winit loads for an X11 window (every Linux
  # desktop has it; the runner image doesn't).
  build-executable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install a display and software Vulkan
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb mesa-vulkan-drivers libxkbcommon-x11-0

      - name: Build the wheel and install it with the build extra
        shell: bash
        run: |
          python -m pip install build
          python -m build --wheel
          python -m venv fresh
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=fresh/Scripts; else BIN=fresh/bin; fi
          echo "BIN=$PWD/$BIN" >> "$GITHUB_ENV"
          WHEEL=$(ls dist/*.whl)
          "$BIN/python" -m pip install "$WHEEL[build]"

      - name: Make an app and build it into one executable, checked
        shell: bash
        run: |
          mkdir work && cd work
          "$BIN/tesserae" new demo --shell
          cd demo
          if [ "$RUNNER_OS" = "Linux" ]; then RUN="xvfb-run -a"; else RUN=""; fi
          $RUN "$BIN/tesserae" build --check
          ls -l dist

      # M78: the installer. On macOS, a .app in a .dmg: mount it, check the
      # .app's details and signature, copy it out as a user would, run it.
      - name: Build the installer (macOS), and install and run it from the .dmg
        if: runner.os == 'macOS'
        shell: bash
        working-directory: work/demo
        run: |
          "$BIN/tesserae" build --installer --check --app-version 1.2.0 --identifier com.example.demo --publisher "Tesserae CI"
          hdiutil attach dist/demo-1.2.0.dmg -mountpoint /tmp/demo-dmg -nobrowse
          ls -la /tmp/demo-dmg
          test -L /tmp/demo-dmg/Applications
          plist=/tmp/demo-dmg/demo.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$plist")" = 1.2.0
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$plist")" = com.example.demo
          codesign --verify --deep --strict --verbose=2 /tmp/demo-dmg/demo.app
          mkdir -p ~/Applications && cp -R /tmp/demo-dmg/demo.app ~/Applications/
          hdiutil detach /tmp/demo-dmg
          cd "$RUNNER_TEMP"
          TESSERAE_MAX_FRAMES=30 TESSERAE_FRAMES_REPORT=frames.txt ~/Applications/demo.app/Contents/MacOS/demo
          echo "installed app drew $(cat frames.txt) frames"
          test "$(cat frames.txt)" = 30

      # On Windows, an Inno Setup installer: built with the runner's Inno
      # Setup 6, then installed silently for this user, run from where it
      # installed, and uninstalled. Then built again with the Inno Setup 7
      # that Tesserae fetches itself.
      - name: Build the installer (Windows), install, run and uninstall it
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: work/demo
        run: |
          $ErrorActionPreference = "Stop"
          $bin = Join-Path $env:GITHUB_WORKSPACE "fresh/Scripts"  # BIN is Git Bash's /d/a/... form
          & "$bin/tesserae.exe" build --installer --check --app-version 1.2.0 --identifier com.example.demo --publisher "Tesserae CI"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Start-Process -Wait -FilePath "dist/demo-1.2.0-setup.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/NORESTART"
          $app = Join-Path $env:LOCALAPPDATA "Programs/demo"
          Get-ChildItem $app | Select-Object -First 5
          $link = Join-Path $env:APPDATA "Microsoft/Windows/Start Menu/Programs/demo.lnk"
          if (-not (Test-Path $link)) { throw "no Start-menu entry at $link" }
          $report = Join-Path $env:RUNNER_TEMP "frames.txt"
          $env:TESSERAE_MAX_FRAMES = "30"; $env:TESSERAE_FRAMES_REPORT = $report
          Start-Process -Wait -NoNewWindow -WorkingDirectory $env:RUNNER_TEMP -FilePath (Join-Path $app "demo.exe")
          $frames = Get-Content $report
          Write-Output "installed app drew $frames frames"
          if ($frames -ne "30") { throw "the installed app drew $frames frames" }
          Remove-Item Env:TESSERAE_MAX_FRAMES, Env:TESSERAE_FRAMES_REPORT
          Start-Process -Wait -FilePath (Join-Path $app "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES"
          Start-Sleep -Seconds 3
          if (Test-Path (Join-Path $app "demo.exe")) { throw "the uninstaller left demo.exe" }
          if (Test-Path $link) { throw "the uninstaller left the Start-menu entry" }
          Write-Output "installed, ran and uninstalled"

      - name: Build the installer (Windows) with the Inno Setup Tesserae fetches
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: work/demo
        run: |
          $ErrorActionPreference = "Stop"
          $bin = Join-Path $env:GITHUB_WORKSPACE "fresh/Scripts"  # BIN is Git Bash's /d/a/... form
          # fetch_iscc says what it's fetching first; its path is the last line
          $iscc = & "$bin/python.exe" -c "from tesserae import build; print(build.fetch_iscc())" | Select-Object -Last 1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Output "fetched $iscc"
          $env:TESSERAE_ISCC = $iscc
          & "$bin/tesserae.exe" build --installer --app-version 1.2.1 --identifier com.example.demo
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path "dist/demo-1.2.1-setup.exe")) { throw "no installer from the fetched Inno Setup" }

      # On Linux, an AppImage, a .deb and a pacman package. The .deb is
      # installed with apt here, run and removed; the AppImage run as it is
      # (no FUSE on the runner); the pacman package installed in an Arch
      # Linux container, with its dependencies from Arch's repositories,
      # and run there under Xvfb with Mesa's software Vulkan.
      - name: Build the installers (Linux), install and run each
        if: runner.os == 'Linux'
        shell: bash
        working-directory: work/demo
        run: |
          set -euo pipefail
          sudo apt-get install -y desktop-file-utils
          xvfb-run -a "$BIN/tesserae" build --installer --check --app-version 1.2.0 --identifier com.example.demo --publisher "Tesserae CI <ci@example.com>"
          ls -l dist
          frames() { cat "$RUNNER_TEMP/frames.txt"; }
          run() { (cd "$RUNNER_TEMP" && TESSERAE_MAX_FRAMES=30 TESSERAE_FRAMES_REPORT="$RUNNER_TEMP/frames.txt" xvfb-run -a "$@"); }

          sudo apt-get install -y ./dist/demo_1.2.0_amd64.deb
          test -L /usr/bin/demo && test -x /opt/demo/demo
          desktop-file-validate /usr/share/applications/com.example.demo.desktop
          run demo && echo ".deb: the installed app drew $(frames) frames" && test "$(frames)" = 30
          sudo apt-get remove -y demo && test ! -e /opt/demo && test ! -e /usr/bin/demo

          APPIMAGE_EXTRACT_AND_RUN=1 run "$PWD/dist/demo-1.2.0-x86_64.AppImage"
          echo "AppImage: drew $(frames) frames" && test "$(frames)" = 30

          docker run --rm -v "$PWD/dist:/pkg:ro" archlinux:latest bash -euc '
            pacman -Syu --noconfirm --needed xorg-server-xvfb vulkan-swrast > /dev/null
            pacman -U --noconfirm /pkg/demo-1.2.0-1-x86_64.pkg.tar.xz
            pacman -Qi demo | head -3
            pacman -Qk demo
            desktop-file-validate /usr/share/applications/com.example.demo.desktop 2>/dev/null || true
            cd /tmp && TESSERAE_MAX_FRAMES=30 TESSERAE_FRAMES_REPORT=/tmp/frames.txt xvfb-run -a demo
            echo "pacman: the installed app drew $(cat /tmp/frames.txt) frames"
            test "$(cat /tmp/frames.txt)" = 30
            pacman -R --noconfirm demo && test ! -e /opt/demo'

      - uses: actions/upload-artifact@v4
        with:
          name: demo-${{ matrix.os }}
          path: work/demo/dist/
